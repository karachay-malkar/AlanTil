<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кюнлюм · сравнение дальних моделей</title>
<style>
 *{box-sizing:border-box}body{margin:0;background:#262824;color:#eee;font:16px system-ui}
 header{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
 select,input{font:inherit}#views{display:grid;grid-template-columns:1fr 1fr;height:75dvh}
 figure{margin:0;min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr}
 figcaption{padding:8px;background:#353830;font-size:.875rem}
 canvas{display:block;width:100%;height:100%;touch-action:none}
 @media(max-width:650px){#views{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:78dvh}}
</style>
<header>
 <label>Объект <select id="subject"><option value="fence">Контрольный пролёт</option><option value="tower">Абай-къала</option></select></label>
 <label>Расстояние <input id="distance" type="range" min="22" max="160" value="65"></label>
 <output id="meters"></output>
 <span id="status" role="status">Загрузка моделей…</span>
</header>
<div id="views">
 <figure><figcaption>Текущий вид · <span id="current-count"></span></figcaption><canvas id="current"></canvas></figure>
 <figure><figcaption>Облегчённая модель · <span id="far-count"></span></figcaption><canvas id="far"></canvas></figure>
</div>
<script type="module" src="./src/features/tower/kunlum-lod-review.js"></script>
</html>
