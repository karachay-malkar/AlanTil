<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kunlum tower construction editor QA</title>
<link rel="stylesheet" href="../../src/shared/styles/app.css">
<link rel="stylesheet" href="../../src/features/tower/tower.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b3c9d9}#qa-root{height:100dvh}</style>
</head><body><div id="qa-root"></div><script type="module">
import {mount,unmount} from '../../src/features/tower/index.js';
const root=document.getElementById('qa-root');
try{
 await mount({
  root,shell:{appShell:document.body,setHeaderContent(){}},
  modal:{async confirm(){return false}}
 },{});
 root.dataset.mount='success';
 window.qaUnmount=unmount;
}catch(error){
 root.dataset.mount='error';root.dataset.mountError=String(error.stack||error);
 console.error('Tower construction editor QA',error);
}
</script></body></html>
