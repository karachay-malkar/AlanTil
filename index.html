  <style>html[data-i18n-ready="false"] #appShell,html[data-scope-ready="false"] #appShell{visibility:hidden}</style>
  <script>
    (() => {
      try {
        const language = localStorage.getItem("alantil_interface_language_v1");
        if (["ru", "en", "tr"].includes(language)) document.documentElement.lang = language;
      } catch {
        // Restricted storage must not expose the wrong language before startup.
      }
    })();
  </script>
  <script>
    (() => {
      // One-release compatibility for deep links created by the pre-13.15 404 page.
      try {
        const restoredPath = sessionStorage.getItem("alantil_spa_path");
        if (!restoredPath) return;
        sessionStorage.removeItem("alantil_spa_path");
        history.replaceState(null, "", restoredPath);
      } catch {
        // Restricted storage must not prevent the application from loading.
      }
    })();
  </script>
  <script>
    (() => {
      const targetVersion = "13.15.12";
      const analyticsTargetVersion = "13.15.9";
      const analyticsPath = "/src/shared/analytics/analytics.js";

        for (const version of versions) imports[`${path}?v=${version}`] = `${path}?v=${targetVersion}`;
      }
      for (const version of [...versions, analyticsTargetVersion]) {
        imports[`${analyticsPath}?v=${version}`] = `${analyticsPath}?v=${analyticsTargetVersion}`;
      }
      const importMap = document.createElement("script");
      importMap.type = "importmap";
      importMap.textContent = JSON.stringify({ imports });
      document.currentScript.after(importMap);
    })();
