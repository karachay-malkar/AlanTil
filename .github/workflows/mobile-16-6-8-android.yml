name: Osuyat 16.6.8 Android

on:
  push:
    branches: [agent/16.6.8-mobile-parity-fixes]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/16.6.8-mobile-parity-fixes"
          test "$(node -p "require('./mobile/app.json').expo.version")" = "16.6.8"
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = "33"
          printf 'branch=%s\ncommit=%s\nrelease=%s\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "16.6.8" > Osuyat-16.6.8.source.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: 16.6.8 regression gate — 64 tests
        run: >-
          node --test
          mobile/tests/mobile-fixes-16-6-8.test.mjs
          mobile/tests/chrome-guide-parity-16-6-3.test.mjs
          mobile/tests/first-run-auth-path-16-6-3.test.mjs
          mobile/tests/path-performance-parity-16-6-3.test.mjs
          mobile/tests/visual-parity-16-6-2.test.mjs
          mobile/tests/visual-parity-16-6-4.test.mjs
          mobile/tests/visual-parity-16-6.test.mjs
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Verify Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Verify generated Android auth intent-filter
        shell: bash
        run: |
          set -euo pipefail
          manifest="mobile/android/app/src/main/AndroidManifest.xml"
          test -f "$manifest"
          grep -F 'android.intent.action.VIEW' "$manifest"
          grep -F 'android.intent.category.BROWSABLE' "$manifest"
          grep -F 'android:scheme="alantil"' "$manifest"
          grep -F 'android:host="auth"' "$manifest"
          grep -F 'android:pathPrefix="/callback"' "$manifest"
      - name: Build standalone release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release APK manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apkanalyzer_bin="$(command -v apkanalyzer || true)"
          if [ -z "$apkanalyzer_bin" ]; then
            apkanalyzer_bin="$(find "${ANDROID_HOME}" -type f -name apkanalyzer -print -quit)"
          fi
          test -n "$apkanalyzer_bin"
          "$apkanalyzer_bin" manifest print "$apk" > Osuyat-16.6.8.AndroidManifest.xml
          grep -F 'android.intent.action.VIEW' Osuyat-16.6.8.AndroidManifest.xml
          grep -F 'android.intent.category.BROWSABLE' Osuyat-16.6.8.AndroidManifest.xml
          grep -F 'android:scheme="alantil"' Osuyat-16.6.8.AndroidManifest.xml
          grep -F 'android:host="auth"' Osuyat-16.6.8.AndroidManifest.xml
          grep -F 'android:pathPrefix="/callback"' Osuyat-16.6.8.AndroidManifest.xml
      - name: Package APK
        shell: bash
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk Osuyat-16.6.8.apk
          sha256sum Osuyat-16.6.8.apk > Osuyat-16.6.8.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Osuyat-16.6.8-APK
          path: |
            Osuyat-16.6.8.apk
            Osuyat-16.6.8.apk.sha256
            Osuyat-16.6.8.source.txt
            Osuyat-16.6.8.AndroidManifest.xml
          if-no-files-found: error
