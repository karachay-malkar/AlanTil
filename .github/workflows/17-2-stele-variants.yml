name: AlanTil 17.2 — optimize approved stele

on:
  push:
    branches: ['17.2']
    paths:
      - 'assets/path/story-stele.webp'
      - 'scripts/assets/optimize-stele.py'
      - '.github/workflows/17-2-stele-variants.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-approved-stele:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate optimized responsive assets
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          python scripts/assets/optimize-stele.py
          python - <<'PY'
          from pathlib import Path
          for width in (640, 932):
              p=Path(f'assets/path/story-stele-{width}.webp')
              assert p.is_file() and p.stat().st_size > 0, p
          assert Path('assets/path/story-stele-640.webp').stat().st_size <= 500*1024
          PY
      - name: Commit approved derivative assets to 17.2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/path/story-stele-640.webp assets/path/story-stele-932.webp
          if git diff --cached --quiet; then
            echo "Approved image variants already up to date."
            exit 0
          fi
          git commit -m "assets(path): responsive derivatives of approved stele"
          git push origin HEAD:17.2
