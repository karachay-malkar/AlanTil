name: Alan Til manual Android release

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alantil-manual-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android release artifacts
        run: npm run release:android
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-Android-release
          path: artifacts/*
          if-no-files-found: error
