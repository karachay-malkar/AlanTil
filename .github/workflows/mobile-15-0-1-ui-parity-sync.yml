name: Apply AlanTil 15.0.1 UI parity patch

on:
  push:
    branches:
      - agent/15.0-unified-core
    paths:
      - '.github/workflows/mobile-15-0-1-ui-parity-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '15.0.1: apply UI parity patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/15.0-unified-core
          fetch-depth: 0

      - name: Apply targeted 15.0.1 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('mobile/src/mobile/path.tsx')
          s=p.read_text()
          s=s.replace("  [...story.catalogs].reverse().forEach((catalog) => {\n    [...catalog.sections].reverse().forEach((section) => {\n      [...section.stations].reverse().forEach((station) => {\n        items.push({\n          type: 'station',\n          key: `station:${station.key}`,\n          station,\n          index: stationIndex.get(station.key) ?? 0,\n        });\n      });\n      items.push({ type: 'section', key: `section:${catalog.id}:${section.id}`, section, catalog });\n    });\n    items.push({ type: 'catalog', key: `catalog:${catalog.id}`, catalog });\n  });", "  [...story.catalogs].reverse().forEach((catalog) => {\n    const reversedSections = [...catalog.sections].reverse();\n    reversedSections.forEach((section, sectionIndex) => {\n      [...section.stations].reverse().forEach((station) => {\n        items.push({\n          type: 'station',\n          key: `station:${station.key}`,\n          station,\n          index: stationIndex.get(station.key) ?? 0,\n        });\n      });\n      // Web 13.15.12 does not render section titles on the route map.\n      // Keep only an invisible boundary spacer between sections for connector/scale anchors.\n      if (sectionIndex < reversedSections.length - 1) {\n        items.push({ type: 'section', key: `section:${catalog.id}:${section.id}`, section, catalog });\n      }\n    });\n    items.push({ type: 'catalog', key: `catalog:${catalog.id}`, catalog });\n  });")
          s=s.replace("style={[styles.pathHeader, { paddingTop: insets.top + 10, height: 82 + insets.top }]}", "style={[styles.pathHeader, { paddingTop: insets.top + 10, height: 68 + insets.top }]}")
          s=s.replace("<Text style={[styles.storyTab, id === story.id && styles.storyTabActive]}>{bundle.route.stories[id].name}</Text>", "<Text style={[styles.storyTab, id === story.id && styles.storyTabActive]}>[ {bundle.route.stories[id].name} ]</Text>")
          s=s.replace("                  {item.section.name ? <Text style={styles.sectionHeading}>{item.section.name}</Text> : null}\n", "")
          s=s.replace("<View pointerEvents=\"none\" style={[styles.pathTopMask, { height: insets.top + 94 }]} />", "<View pointerEvents=\"none\" style={[styles.pathTopMask, { height: insets.top + 78 }]} />")
          s=s.replace("  pathTopMask: { position: 'absolute', left: 0, right: 0, top: 0, zIndex: 20, backgroundColor: 'rgba(238,233,223,0.76)' },", "  pathTopMask: { position: 'absolute', left: 0, right: 0, top: 0, zIndex: 20, backgroundColor: 'rgba(238,233,223,0.62)' },")
          s=s.replace("  pathHeader: { zIndex: 30, height: 82, paddingHorizontal: 8, paddingBottom: 4, backgroundColor: 'transparent' },", "  pathHeader: { zIndex: 30, height: 68, paddingHorizontal: 8, paddingBottom: 4, backgroundColor: 'transparent' },")
          s=s.replace("  storyTabButton: { minHeight: 44, justifyContent: 'center', paddingHorizontal: 5 },", "  storyTabButton: { height: 32, justifyContent: 'center', paddingHorizontal: 4 },")
          s=s.replace("  catalogHeadingBlock: { zIndex: 1, minHeight: 28, width: '100%', alignItems: 'center', justifyContent: 'center', marginBottom: 64 },", "  catalogHeadingBlock: { zIndex: 1, minHeight: 28, width: '100%', alignItems: 'center', justifyContent: 'center', marginTop: 22, marginBottom: 118 },")
          s=s.replace("  sectionHeadingBlock: { zIndex: 1, minHeight: 24, width: '100%', alignItems: 'center', justifyContent: 'center', marginBottom: 52 },", "  sectionHeadingBlock: { zIndex: 1, height: 92, width: '100%' },")
          s=s.replace("  stationNode: { zIndex: 1, width: 60, height: 108, marginBottom: 30, alignItems: 'center', overflow: 'visible' },", "  stationNode: { zIndex: 1, width: 60, height: 60, marginBottom: 43, alignItems: 'center', overflow: 'visible' },")
          p.write_text(s)

          p=Path('mobile/src/mobile/path-visual-policy.ts')
          s=p.read_text().replace("  const pattern = [-amplitude, 0, amplitude, 0] as const;\n  return pattern[Math.max(0, Math.floor(index)) % designTokens.path.waveSteps];", "  // Web 13.15.12 alternates stations left/right with no center stop.\n  return Math.max(0, Math.floor(index)) % 2 === 0 ? -amplitude : amplitude;")
          p.write_text(s)

          p=Path('packages/alantil-core/practice.js')
          s=p.read_text()
          marker='\nexport function buildTestWords(pool, totalLimit) {'
          addition='''\nexport function buildTestOptions(item, optionPool, mode = "kb", count = 4) {\n  if (!item) return [];\n  const desired = Math.max(1, Math.floor(Number(count) || 4));\n  const answerText = (word) => normalizeId(mode === "kb" ? word?.trans : word?.word);\n  const itemId = normalizeId(item?.id ?? item?.word_id);\n  const correctText = answerText(item);\n  const targetPOS = normalizePos(item?.pos);\n  const source = (Array.isArray(optionPool) ? optionPool : []).filter(Boolean);\n  const selectedWords = [];\n  const options = [{ id: itemId, text: correctText }];\n  const usedIds = new Set([itemId]);\n  const usedTexts = new Set([correctText]);\n\n  const appendFrom = (candidates, requireConflictFree) => {\n    for (const candidate of shuffle(candidates.slice())) {\n      if (options.length >= desired) break;\n      const id = normalizeId(candidate?.id ?? candidate?.word_id);\n      const text = answerText(candidate);\n      if (!id || usedIds.has(id) || !text || usedTexts.has(text)) continue;\n      if (requireConflictFree && hasWordConflict(candidate, [item, ...selectedWords])) continue;\n      usedIds.add(id);\n      usedTexts.add(text);\n      selectedWords.push(candidate);\n      options.push({ id, text });\n    }\n  };\n\n  const samePOS = source.filter((candidate) => normalizePos(candidate?.pos) === targetPOS);\n  appendFrom(samePOS, true);\n  if (options.length < desired) appendFrom(source, true);\n  if (options.length < desired) appendFrom(samePOS, false);\n  if (options.length < desired) appendFrom(source, false);\n  return shuffle(options.slice(0, desired));\n}\n'''
          if 'export function buildTestOptions(' not in s:
            s=s.replace(marker, addition+marker)
          p.write_text(s)

          p=Path('packages/alantil-core/practice.d.ts')
          s=p.read_text()
          line='export function buildWordsByPOSRounds<T extends CorePracticeWord>(pool: T[], totalLimit: number, options?: BuildWordsOptions): BuildWordsResult<T>;\n'
          if 'buildTestOptions<' not in s:
            s=s.replace(line, line+'export function buildTestOptions<T extends CorePracticeWord>(item: T, optionPool: T[], mode?: "kb" | "ru", count?: number): { id: string; text: string }[];\n')
          p.write_text(s)

          p=Path('mobile/src/mobile/practice/selection.ts')
          s=p.read_text()
          s=s.replace('  buildScope,\n  buildTestWords,', '  buildScope,\n  buildTestOptions,\n  buildTestWords,')
          s=s.replace('  buildScope,\n  buildTestWords,', '  buildScope,\n  buildTestOptions,\n  buildTestWords,')
          s=s.replace('  buildTestOptions,\n  buildTestOptions,\n','  buildTestOptions,\n')
          p.write_text(s)

          p=Path('mobile/src/mobile/practice/test.tsx')
          s=p.read_text()
          s=s.replace("import { buildScope, buildSelectedSources, buildTestWords, hasWordConflict, normalizePos, scopeKey, shuffle, type PracticeWord } from '@/src/mobile/practice/selection';", "import { buildScope, buildSelectedSources, buildTestOptions, buildTestWords, scopeKey, type PracticeWord } from '@/src/mobile/practice/selection';")
          start=s.index('function optionsFor('); end=s.index('\n\nfunction sessionPayload', start)
          s=s[:start]+"function optionsFor(item: PracticeWord, optionPool: PracticeWord[], mode: TestMode) {\n  return buildTestOptions(item, optionPool, mode, 4);\n}"+s[end:]
          p.write_text(s)

          p=Path('src/shared/domain/word-selection.js')
          s=p.read_text()
          if '  buildTestOptions,' not in s:
            s=s.replace('  buildScope,\n', '  buildScope,\n  buildTestOptions,\n')
          p.write_text(s)

          p=Path('src/features/test/engine.js')
          s=p.read_text()
          s=s.replace('import { normalizePos } from "../../shared/domain/word-normalizer.js?v=13.9.0";\n','')
          s=s.replace('import { buildTestWords, hasWordConflict, shuffle } from "../../shared/domain/word-selection.js?v=13.13";', 'import { buildTestOptions, buildTestWords } from "../../shared/domain/word-selection.js?v=15.0.1";')
          start=s.index('export function pickOptions(item) {'); end=s.index('\n\nexport function submitAnswer', start)
          s=s[:start]+'export function pickOptions(item) {\n  return buildTestOptions(item, testState.optionPool, testState.mode, 4);\n}'+s[end:]
          p.write_text(s)

          p=Path('packages/alantil-core/station-test.js')
          s=p.read_text()
          s=s.replace("import { hasWordConflict, normalizePos, parseSynonyms, shuffle, splitGroups } from './practice.js';", "import { buildTestOptions, hasWordConflict, normalizePos, parseSynonyms, shuffle, splitGroups } from './practice.js';")
          old="""export function stationTestDistractors(item, allWords, count = 3) {\n  const targetPos = normalizePos(item?.pos);\n  const samePos = shuffle((Array.isArray(allWords) ? allWords : []).filter((candidate) => normalizePos(candidate?.pos) === targetPos).slice());\n  const selected = [];\n  for (const candidate of samePos) {\n    if (selected.length >= Math.max(0, Number(count || 0))) break;\n    if (stationTestCandidateIsAmbiguous(candidate, item, selected)) continue;\n    selected.push(candidate);\n  }\n  return selected;\n}\n\nexport function buildStationTestOptions(item, allWords, mode = 'kb', count = 3) {\n  const words = [item, ...stationTestDistractors(item, allWords, count)].filter(Boolean);\n  return shuffle(words).map((word) => ({\n    id: String(word.id),\n    text: String(mode === 'ru' || mode === 'ru_alan' ? word.word : word.trans || ''),\n    word,\n  }));\n}\n"""
          new="""export function stationTestDistractors(item, allWords, count = 3) {\n  const targetPos = normalizePos(item?.pos);\n  const source = (Array.isArray(allWords) ? allWords : []).filter(Boolean);\n  const selected = [];\n  const appendSafe = (candidates) => {\n    for (const candidate of shuffle(candidates.slice())) {\n      if (selected.length >= Math.max(0, Number(count || 0))) break;\n      if (stationTestCandidateIsAmbiguous(candidate, item, selected)) continue;\n      selected.push(candidate);\n    }\n  };\n  appendSafe(source.filter((candidate) => normalizePos(candidate?.pos) === targetPos));\n  if (selected.length < count) appendSafe(source);\n  return selected;\n}\n\nexport function buildStationTestOptions(item, allWords, mode = 'kb', count = 3) {\n  const desired = Math.max(1, Math.floor(Number(count || 0)) + 1);\n  const strictWords = [item, ...stationTestDistractors(item, allWords, count)].filter(Boolean);\n  if (strictWords.length >= desired) {\n    return shuffle(strictWords).map((word) => ({\n      id: String(word.id),\n      text: String(mode === 'ru' || mode === 'ru_alan' ? word.word : word.trans || ''),\n      word,\n    }));\n  }\n  const normalizedMode = mode === 'ru' || mode === 'ru_alan' ? 'ru' : 'kb';\n  const byId = new Map((Array.isArray(allWords) ? allWords : []).map((word) => [String(word?.id ?? ''), word]));\n  return buildTestOptions(item, allWords, normalizedMode, desired).map((option) => ({ ...option, word: byId.get(String(option.id)) || item }));\n}\n"""
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('mobile/tests/path-visual.test.mjs')
          s=p.read_text().replace("test('Path follows the final web four-step left, center, right, center wave', () => {\n  const shifts = Array.from({ length: 8 }, (_, index) => routeWaveShift(index, 360));\n  assert.deepEqual(shifts, [-79.2, 0, 79.2, 0, -79.2, 0, 79.2, 0]);", "test('Path follows the final Web 13.15.12 alternating left/right station wave', () => {\n  const shifts = Array.from({ length: 8 }, (_, index) => routeWaveShift(index, 360));\n  assert.deepEqual(shifts, [-79.2, 79.2, -79.2, 79.2, -79.2, 79.2, -79.2, 79.2]);")
          p.write_text(s)

          p=Path('tests/alantil-core-practice-15.test.mjs')
          s=p.read_text()
          if '  buildTestOptions,\n' not in s:
            s=s.replace('  buildTestWords,\n','  buildTestOptions,\n  buildTestWords,\n',1)
          anchor="test('15.0 shared practice core fills sparse POS test rounds from other parts of speech', () => {"
          if "shared test options stay at four choices" not in s:
            test="""test('15.0 shared test options stay at four choices even when same-POS distractors are sparse', () => {\n  const pool = [\n    { id: 'n1', word: 'alan-1', trans: 'one', pos: 'noun', synonyms: [] },\n    { id: 'n2', word: 'alan-2', trans: 'two', pos: 'noun', synonyms: [] },\n    { id: 'v1', word: 'alan-3', trans: 'three', pos: 'verb', synonyms: [] },\n    { id: 'a1', word: 'alan-4', trans: 'four', pos: 'adjective', synonyms: [] },\n    { id: 'd1', word: 'alan-5', trans: 'five', pos: 'adverb', synonyms: [] },\n  ];\n  const options = buildTestOptions(pool[0], pool, 'kb', 4);\n  assert.equal(options.length, 4);\n  assert.equal(new Set(options.map((option) => option.text)).size, 4);\n  assert.equal(options.filter((option) => option.id === 'n1').length, 1);\n});\n\n"""
            s=s.replace(anchor,test+anchor)
          p.write_text(s)

          p=Path('tests/alantil-core-station-test-15.test.mjs')
          s=p.read_text().replace("  assert.ok(options.length >= 1 && options.length <= 4);", "  assert.equal(options.length, 4);")
          p.write_text(s)

          p=Path('mobile/app.json'); d=json.loads(p.read_text()); e=d['expo']; e['version']='15.0.1'; e['android']['versionCode']=9; e['ios']['buildNumber']='9'; e['extra']['releaseVersion']='15.0.1'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=Path('mobile/package.json'); d=json.loads(p.read_text()); d['version']='15.0.1'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=Path('mobile/package-lock.json'); d=json.loads(p.read_text()); d['version']='15.0.1'; d['packages']['']['version']='15.0.1'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit parity patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile packages src tests
          git commit -m "15.0.1: apply UI parity patch and four-option tests"
          git push origin HEAD:agent/15.0-unified-core
