name: Tower 17.2 — generate 1K stone maps
on:
  push:
    branches: ['17.2']
    paths:
      - '.github/workflows/tower-stone-1k-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  textures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resize authored maps to 1K without changing UV or stone colour
        run: |
          python -m pip install --quiet Pillow==11.1.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('assets/tower/materials/balkaria-stone-v2.1')
          for name in ('BaseColor','Normal_OpenGL','ORM'):
              source=root/f'BalkariaStone_{name}_2K.png'
              target=root/f'BalkariaStone_{name}_1K.png'
              with Image.open(source) as img:
                  if img.size!=(2048,2048):
                      raise SystemExit(f'Unexpected source size: {source} {img.size}')
                  img.resize((1024,1024),Image.Resampling.LANCZOS).save(target,optimize=True)
              print(f'{target}: {target.stat().st_size} bytes')
          PY
      - name: Publish generated textures to the agreed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/materials/balkaria-stone-v2.1/*_1K.png
          if git diff --cached --quiet; then
            echo '1K textures already committed'
            exit 0
          fi
          git commit -m 'assets(tower): generate native 1K PBR stone textures for mobile'
          git push origin HEAD:17.2
