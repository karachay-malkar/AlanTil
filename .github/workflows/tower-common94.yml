name: Build and verify unified 94-stone library
on:
  push:
    branches:
      - agent/tower-common94-20261017
    paths:
      - tools/tower/build-common94.py
      - .github/workflows/tower-common94.yml
permissions:
  contents: write
jobs:
  bake-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tower-common94-20261017
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline 3D baker dependencies
        run: pip install 'numpy==2.2.6' 'trimesh==4.11.1' scipy pillow
      - name: Build actual 63+29+2 source meshes
        run: python tools/tower/build-common94.py
      - name: Verify geometry and historical model preservation
        run: |
          python - <<'PY'
          import json, pathlib, trimesh, numpy as np
          root=pathlib.Path('assets/tower/prefabs')
          data=json.loads((root/'common94/common-94.json').read_text())
          source=trimesh.load(root/'balkar71/library-wall-17_5_5.glb',force='scene',process=False)
          united=trimesh.load(root/'common94/common-94.glb',force='scene',process=False)
          assert len(source.geometry)==63
          assert len(united.geometry)==94
          assert data['counts']=={'wall':63,'chinking':29,'lintel':2}
          assert set(source.geometry).issubset(set(united.geometry))
          for name,mesh in source.geometry.items():
              b=united.geometry[name]
              np.testing.assert_allclose(mesh.vertices,b.vertices,rtol=1e-5,atol=1e-5,err_msg=name)
              np.testing.assert_array_equal(mesh.faces,b.faces,err_msg=name)
          for name in ['LINTEL_WINDOW','LINTEL_DOOR']:
              m=united.geometry[name]
              assert m.is_volume and m.visual.uv is not None, name
          assert len([n for n in united.geometry if n.startswith('CHINK_')])==29
          assert all(united.geometry[n].is_volume for n in united.geometry if n.startswith('CHINK_'))
          assert (root/'common94/common-94.glb').stat().st_size>100000
          print('COMMON94_VERIFIED_FULL_SOURCE_63+29+2')
          PY
      - name: Regress existing 17.5.5 library
        run: node --test tests/compact-stones-1755.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-common94-3D-library
          path: |
            assets/tower/prefabs/common94/common-94.glb
            assets/tower/prefabs/common94/common-94.json
      - name: Commit checked 94-rock assets into feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tower/prefabs/common94/common-94.glb assets/tower/prefabs/common94/common-94.json
          if git diff --cached --quiet; then echo 'ASSETS_UNCHANGED'; else
            git commit -m 'assets(tower): add verified unified library of 94 stone meshes'
            git push origin HEAD:agent/tower-common94-20261017
          fi
