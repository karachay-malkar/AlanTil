name: AlanTil 16.1 Android

on:
  push:
    branches:
      - agent/16.1-mobile-web-parity
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Mobile architecture tests
        working-directory: mobile
        run: npm test
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Verify JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Package APK
        shell: bash
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk AlanTil-16.1.0.apk
          sha256sum AlanTil-16.1.0.apk > AlanTil-16.1.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.1.0-APK
          path: |
            AlanTil-16.1.0.apk
            AlanTil-16.1.0.apk.sha256
          if-no-files-found: error
