name: Manual Common100 source sections QA
on:
  push:
    branches: [main, '17.2']
    paths:
      - 'assets/tower/sections/manual-common100/**'
      - 'src/features/masonry/manual-sections/**'
      - 'src/features/masonry/index.js'
      - 'src/features/masonry/scene.js'
      - 'src/features/masonry/staging-position.mjs'
      - 'src/features/masonry/masonry.css'
      - 'scripts/qa/manual-common100-sources.test.mjs'
      - 'scripts/qa/manual-masonry-stage.test.mjs'
      - '.github/workflows/manual-common100-sources-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pure source registry syntax
        run: node --check src/features/masonry/manual-sections/registry.mjs
      - name: Verify source section fingerprint, transforms and isolation
        run: node --test scripts/qa/manual-common100-sources.test.mjs
      - name: Verify staging geometry and compact mobile editor
        run: |
          node --check src/features/masonry/staging-position.mjs
          node --check src/features/masonry/scene.js
          node --check src/features/masonry/index.js
          node --test scripts/qa/manual-masonry-stage.test.mjs
