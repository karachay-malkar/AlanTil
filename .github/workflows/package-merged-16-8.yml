name: package merged 16.8.0

on:
  push:
    branches:
      - agent/16.8.0-package-94092452

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build exact merged archive
        run: git archive --format=zip --output=AlanTil-16.8.0-94092452.zip HEAD^
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.8.0-94092452
          path: AlanTil-16.8.0-94092452.zip
          if-no-files-found: error
