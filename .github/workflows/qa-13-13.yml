name: QA 13.13

on:
  push:
    branches:
      - "13.13"

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "13.13"
      - name: Run acceptance tests and publish report
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > QA_13.13.txt 2>&1
          status=$?
          printf '\nEXIT_CODE=%s\n' "$status" >> QA_13.13.txt
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QA_13.13.txt
          git commit -m 'chore: generated 13.13 QA report'
          git push origin HEAD:13.13
          exit "$status"
