name: Apply AlanTil 16.1 parity payload

on:
  push:
    branches:
      - agent/16.1-mobile-web-parity
    paths:
      - '.tmp161/chunk*'
      - '.github/workflows/apply-16-1-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact 16.1 files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .tmp161/chunk00 ]; then
            echo 'payload already applied'
            exit 0
          fi
          for n in 00 01 02 03 04 05 06; do test -f ".tmp161/chunk$n"; done
          cat .tmp161/chunk00 .tmp161/chunk01 .tmp161/chunk02 .tmp161/chunk03 .tmp161/chunk04 .tmp161/chunk05 .tmp161/chunk06 | tr -d '\r\n' | base64 -d > /tmp/alantil161.tgz
          tar -tzf /tmp/alantil161.tgz >/dev/null
          tar -xzf /tmp/alantil161.tgz -C .
          rm -rf .tmp161
          git config user.name 'taulu'
          git config user.email 'taulantau5@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m '16.1: implement mobile web parity'
          git push origin HEAD:agent/16.1-mobile-web-parity
