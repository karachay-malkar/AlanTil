name: AlanTil 15 release metadata sync

on:
  push:
    branches:
      - agent/15.0-unified-core
    paths:
      - '.github/workflows/mobile-15-dependency-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/15.0-unified-core
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install pinned project dependencies
        working-directory: mobile
        run: npm ci
      - name: Set 15.0 release version
        shell: bash
        run: |
          cd mobile
          npm version 15.0.0 --no-git-tag-version
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const app = JSON.parse(readFileSync('app.json', 'utf8'));
          app.expo.version = '15.0.0';
          app.expo.android.versionCode = 8;
          app.expo.ios.buildNumber = '8';
          app.expo.extra = {
            ...(app.expo.extra || {}),
            releaseVersion: '15.0.0',
            visualParity: '15.0-unified-core',
          };
          writeFileSync('app.json', `${JSON.stringify(app, null, 2)}\n`);
          NODE
          node scripts/release-metadata.mjs >/dev/null
      - name: Commit generated release metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package.json mobile/package-lock.json mobile/app.json
          git commit -m '15.0: set mobile release version' || exit 0
          git push origin HEAD:agent/15.0-unified-core
