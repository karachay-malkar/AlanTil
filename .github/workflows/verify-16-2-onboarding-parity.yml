name: Verify 16.2 Onboarding Parity

on:
  push:
    branches:
      - agent/16.2-onboarding-parity
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shared core tests
        run: node --test tests/alantil-core-16.test.mjs
      - name: Mobile architecture tests
        working-directory: mobile
        run: npm test
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Export Expo Web preview
        working-directory: mobile
        run: npm run export:web
