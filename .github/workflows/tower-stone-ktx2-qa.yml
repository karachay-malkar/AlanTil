name: QA BalkariaStone v2.1 KTX2 runtime
on:
  push:
    branches: ['17.2']
    paths:
      - '.github/workflows/tower-stone-ktx2-qa.yml'
      - 'src/features/tower/rock-surface.js'
      - 'src/features/tower/prefab-scene.js'
      - 'src/vendor/three/addons/loaders/KTX2Loader.js'
      - 'src/vendor/three/addons/libs/**'
      - 'src/vendor/three/addons/math/**'
      - 'assets/tower/materials/balkaria-stone-v2.1/**'
      - 'tests/rock-surface-ktx2.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax and PBR/KTX2 asset contracts
        run: |
          node --check src/features/tower/rock-surface.js
          node --check src/features/tower/prefab-scene.js
          node --check src/vendor/three/addons/loaders/KTX2Loader.js
          node --check src/vendor/three/addons/math/ColorSpaces.js
          node --test tests/rock-surface-ktx2.test.mjs
      - name: Existing tower, gate, door and window regressions
        run: node --test tests/tower-*.test.mjs tests/gate-prefab.test.mjs tests/door-prefab.test.mjs tests/window-prefab.test.mjs
