name: QA interactive 100-rock 3D gallery
on:
  push:
    branches: ['17.2']
    paths:
      - 'tower-common100-review.html'
      - 'scripts/qa/browser-tower-common100-review.cjs'
      - '.github/workflows/tower-common100-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webgl-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright / Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check 3D viewer for all stone categories and on mobile
        run: node scripts/qa/browser-tower-common100-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common100-real-3D-browser-verification
          path: /tmp/alantil-common100-qa/*.png
          if-no-files-found: warn
