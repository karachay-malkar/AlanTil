name: Temporary Ashyk runtime sync 16.8.0.9
on:
  push:
    branches: [agent/ashyk-runtime-sync-16.8.0.9]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Ashyk build dependencies
        working-directory: tools/ashyk-web
        run: npm ci --no-audit --no-fund
      - name: Rebuild generated Ashyk runtime
        run: node tools/ashyk-web/build.mjs
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ashyk/runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "temp: ashyk-runtime-synced"
          git push
