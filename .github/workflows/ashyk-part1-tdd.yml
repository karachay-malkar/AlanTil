name: Ashyk part 1 TDD
on:
  push:
    branches:
      - agent/16.8.0-ashyk-guest-part1-tdd
permissions:
  contents: read
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Part 1 regression
        run: node --test tests/ashyk-guest-computer-16-8.test.mjs
      - name: Architecture regressions
        run: node --test tests/unified-core-boundary-16.test.mjs mobile/tests/architecture.test.mjs
      - name: Existing Ashyk regressions
        run: node --test tests/ashyk-native-core-16-6-11.test.mjs tests/ashyk-web-parity-16-6-13.test.mjs tests/social-ashyk-16-7-0.test.mjs tests/ashyk-online-authority-16-7.test.mjs tests/ashyk-shot-replication-16-7.test.mjs tests/ashyk-wood-board-16-7-0.test.mjs mobile/tests/ashyk-ui-help-16-6-12.test.mjs
      - name: Access invariant
        run: node scripts/enforce-registered-ashyk-modes-16-7.mjs
      - name: Generated checks
        run: |
          node scripts/sync-visual-contract-16-7.mjs --check
          node scripts/qa/check-generated.mjs --ashyk
