name: Ashyk part 1 TDD
on:
  push:
    branches:
      - agent/16.8.0-ashyk-guest-part1-tdd
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Part 1 regression
        run: node --test tests/ashyk-guest-computer-16-8.test.mjs tests/ashyk-web-parity-16-6-13.test.mjs tests/ashyk-native-core-16-6-11.test.mjs
      - name: Access invariant
        run: node scripts/enforce-registered-ashyk-modes-16-7.mjs
      - name: Regenerate visual manifest and Web runtime
        run: |
          node scripts/sync-visual-contract-16-7.mjs
          node tools/ashyk-web/build.mjs
      - name: Commit generated artifacts
        run: |
          if ! git diff --quiet -- mobile/ui/web-visual-source.js src/features/ashyk/runtime.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/ui/web-visual-source.js src/features/ashyk/runtime.js
            git commit -m "build: refresh Ashyk part 1 generated artifacts"
            git push
          fi
      - name: Generated checks
        run: |
          node scripts/sync-visual-contract-16-7.mjs --check
          node scripts/qa/check-generated.mjs --ashyk
