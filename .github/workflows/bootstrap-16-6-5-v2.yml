name: Bootstrap AlanTil 16.6.5 staging v2

on:
  push:
    branches: [agent/16.6.5-bootstrap2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble exact 16.6.5 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part{00..12}.b64 > "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz.b64" > "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz"
          echo 'ae6fe12c08c7ef62ccfb45c5cc1b8c92fcd871203042e9fbdee9a06ccc59dee2  '"$RUNNER_TEMP/AlanTil-16.6.5.patch.gz" | sha256sum -c -
          gzip -t "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz"
          gunzip -c "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz" > "$RUNNER_TEMP/AlanTil-16.6.5.patch"
          echo 'b2555c8cecad26ecfcd5dd8bc17fcc7fbda5afd6750793ba84c3431188d50e24  '"$RUNNER_TEMP/AlanTil-16.6.5.patch" | sha256sum -c -
      - name: Apply tracked 16.6.5 patch
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 50c5dbf28596c9b9c12b292ca89115a37dd42710
          git apply --index --binary "$RUNNER_TEMP/AlanTil-16.6.5.patch"
          git diff --cached --check
          echo "tracked_files=$(git diff --cached --name-only | wc -l)"
          mkdir -p "$RUNNER_TEMP/at1665-tracked"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/at1665-tracked"
          while IFS= read -r path; do
            mkdir -p "$RUNNER_TEMP/at1665-tracked/$(dirname "$path")"
            cp -a "$path" "$RUNNER_TEMP/at1665-tracked/$path"
          done < <(git diff --cached --name-only)
          tar -C "$RUNNER_TEMP/at1665-tracked" -czf "$RUNNER_TEMP/AlanTil-16.6.5-tracked-snapshot.tgz" .
          sha256sum "$RUNNER_TEMP/AlanTil-16.6.5-tracked-snapshot.tgz"
      - name: Upload tracked snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.6.5-tracked-snapshot
          path: ${{ runner.temp }}/AlanTil-16.6.5-tracked-snapshot.tgz
          if-no-files-found: error
          retention-days: 3
