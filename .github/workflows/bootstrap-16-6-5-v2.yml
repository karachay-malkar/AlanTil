name: Bootstrap AlanTil 16.6.5 staging v2

on:
  push:
    branches: [agent/16.6.5-bootstrap2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble exact 16.6.5 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part{00..12}.b64 > "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz.b64" > "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz"
          echo 'ae6fe12c08c7ef62ccfb45c5cc1b8c92fcd871203042e9fbdee9a06ccc59dee2  '"$RUNNER_TEMP/AlanTil-16.6.5.patch.gz" | sha256sum -c -
          gzip -t "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz"
          gunzip -c "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz" > "$RUNNER_TEMP/AlanTil-16.6.5.patch"
          echo 'b2555c8cecad26ecfcd5dd8bc17fcc7fbda5afd6750793ba84c3431188d50e24  '"$RUNNER_TEMP/AlanTil-16.6.5.patch" | sha256sum -c -
      - name: Apply tracked patch and print missing shared contracts
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 50c5dbf28596c9b9c12b292ca89115a37dd42710
          git apply --index --binary "$RUNNER_TEMP/AlanTil-16.6.5.patch"
          echo '=== PATCHED FILES ==='
          git diff --cached --name-only
          echo '=== ALANTIL-UI REFERENCES ==='
          grep -RIn --exclude-dir=node_modules --exclude='*.map' 'alantil-ui' mobile src scripts tests .github 2>/dev/null || true
          echo '=== CHROME-MASK REFERENCES ==='
          grep -RIn --exclude-dir=node_modules --exclude='*.map' 'chrome-mask' mobile src scripts tests .github 2>/dev/null || true
          echo '=== 16.6.5 NEW SCRIPT/TEST REFERENCES ==='
          grep -RIn --exclude-dir=node_modules --exclude='*.map' '16-6-5\|16\.6\.5' mobile src scripts tests .github 2>/dev/null || true
          echo '=== IMPORT LINES FROM PATCHED MOBILE UI ==='
          grep -RIn --include='*.js' --include='*.mjs' '^import\|^export .* from' mobile src 2>/dev/null | grep -E 'alantil-ui|chrome-mask|shared-visual' || true
          echo '=== STATUS ==='
          git status --short
