name: Bootstrap AlanTil 16.6.5 staging v2

on:
  push:
    branches: [agent/16.6.5-bootstrap2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble exact 16.6.5 source transport
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part{00..12}.b64 > "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz.b64" > "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz"
          echo 'ae6fe12c08c7ef62ccfb45c5cc1b8c92fcd871203042e9fbdee9a06ccc59dee2  '"$RUNNER_TEMP/AlanTil-16.6.5.patch.gz" | sha256sum -c -
          gzip -t "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz"
          gunzip -c "$RUNNER_TEMP/AlanTil-16.6.5.patch.gz" > "$RUNNER_TEMP/AlanTil-16.6.5.patch"
          echo 'b2555c8cecad26ecfcd5dd8bc17fcc7fbda5afd6750793ba84c3431188d50e24  '"$RUNNER_TEMP/AlanTil-16.6.5.patch" | sha256sum -c -
          cat .bootstrap/new{00..02}.b64 > "$RUNNER_TEMP/AlanTil-16.6.5-newfiles.tgz.b64"
          base64 -d "$RUNNER_TEMP/AlanTil-16.6.5-newfiles.tgz.b64" > "$RUNNER_TEMP/AlanTil-16.6.5-newfiles.tgz"
          echo '21e544149b6674c8671e820a87c713bef97f0d155f8c1f0a501ca7a4b45119c7  '"$RUNNER_TEMP/AlanTil-16.6.5-newfiles.tgz" | sha256sum -c -
          tar -tzf "$RUNNER_TEMP/AlanTil-16.6.5-newfiles.tgz" >/dev/null
      - name: Apply complete 55-file 16.6.5 source and verify
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 50c5dbf28596c9b9c12b292ca89115a37dd42710
          git apply --index --binary "$RUNNER_TEMP/AlanTil-16.6.5.patch"
          tar -xzf "$RUNNER_TEMP/AlanTil-16.6.5-newfiles.tgz" -C .
          git add -A
          test "$(git diff --cached --name-only | wc -l)" = '55'
          git diff --cached --check
          node scripts/check-shared-visual-contract-16-6-5.mjs
          node --test mobile/tests/*.test.mjs
          node scripts/generate-shared-visual-css.mjs
          git diff --exit-code -- src/shared/styles/shared-visual-tokens.css
      - name: Publish one-clean-commit staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete 16.6.5 unified visual parity contract'
          test "$(git rev-list --count 50c5dbf28596c9b9c12b292ca89115a37dd42710..HEAD)" = '1'
          git push --force origin HEAD:agent/16.6.5-staging
