name: Ops Supabase Credential Check

on:
  push:
    branches:
      - ops/word-sync-2026-08-08
    paths:
      - .github/workflows/ops-supabase-secret-check-20260808.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/word-sync-2026-08-08
      - name: Record credential availability only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops_final_bundle
          bool() { if [ -n "$1" ]; then printf true; else printf false; fi; }
          cat > ops_final_bundle/secret_check.json <<JSON
          {
            "SUPABASE_ACCESS_TOKEN": $(bool "${SUPABASE_ACCESS_TOKEN:-}"),
            "SUPABASE_SERVICE_ROLE_KEY": $(bool "${SUPABASE_SERVICE_ROLE_KEY:-}"),
            "SUPABASE_SECRET_KEY": $(bool "${SUPABASE_SECRET_KEY:-}"),
            "SUPABASE_DB_PASSWORD": $(bool "${SUPABASE_DB_PASSWORD:-}"),
            "SUPABASE_DATABASE_URL": $(bool "${SUPABASE_DATABASE_URL:-}"),
            "DATABASE_URL": $(bool "${DATABASE_URL:-}"),
            "POSTGRES_URL": $(bool "${POSTGRES_URL:-}")
          }
          JSON
      - name: Commit status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops_final_bundle/secret_check.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record Supabase credential availability"
          git push origin HEAD:ops/word-sync-2026-08-08
