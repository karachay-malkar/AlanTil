name: AlanTil 16.7.13 Performance QA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'service-worker.js'
      - 'assets/**'
      - 'mobile/screens/**'
      - 'mobile/platform/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/performance-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check src/features/masonry/library.js
          node --check src/features/masonry/scene.js
          node --check src/features/masonry/index.js
          node --check src/app/router.js
          node --check src/app/bootstrap.js
          node --check service-worker.js
          node --check scripts/report-lighthouse.mjs
          node --check scripts/static-preview-server.mjs
      - name: Regression suite
        run: |
          node --test \
            tests/masonry-performance-16-7-10.test.mjs \
            tests/performance-16-7-9.test.mjs \
            tests/performance-16-7-12.test.mjs \
            tests/performance-16-7-13.test.mjs \
            tests/service-worker-16-7-13.test.mjs \
            tests/asset-versioning.test.mjs \
            tests/story-stele-13-15-1.test.mjs

  browser-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start the current source as a local SPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          node scripts/static-preview-server.mjs > perf-results/server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Current main serves successfully."
              exit 0
            fi
            sleep 1
          done
          cat perf-results/server.log
          exit 1
      - name: Lighthouse mobile on current main source
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome)"
          npx --yes lighthouse@12.8.2 --version
          for page in path/oblivion practice profile friends; do
            name="${page//\//-}"
            npx --yes lighthouse@12.8.2 "http://127.0.0.1:4173/$page" \
              --only-categories=performance \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json --output-path="perf-results/$name.report.json" --quiet
          done
      - name: Report source performance
        if: always()
        shell: bash
        run: |
          node scripts/report-lighthouse.mjs
          cat perf-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check published site version
        if: always()
        shell: bash
        run: |
          set -u
          code="$(curl -sSL --max-time 25 -w '%{http_code}' -o perf-results/production.html https://alantil.ru/ || true)"
          served="$(grep -oE 'targetVersion = "[^"]+"' perf-results/production.html 2>/dev/null | head -1 || true)"
          echo "Published site HTTP: $code; detected release: ${served:-unknown}"
          echo "Production alantil.ru: HTTP $code; release ${served:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$served" != 'targetVersion = "16.7.13"' ]]; then
            echo "::warning::Production site is not serving the current GitHub main release (16.7.13)"
          fi
      - name: Upload reports and production diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alantil-source-lighthouse-16-7-13
          path: perf-results/
          if-no-files-found: warn
          retention-days: 21
