name: AlanTil 16.7.10 Performance QA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'service-worker.js'
      - 'assets/**'
      - 'mobile/screens/**'
      - 'mobile/platform/**'
      - 'tests/**'
      - '.github/workflows/performance-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check src/features/masonry/library.js
          node --check src/features/masonry/scene.js
          node --check src/features/masonry/index.js
          node --check src/app/router.js
          node --check src/app/bootstrap.js
          node --check service-worker.js
          node --check scripts/report-lighthouse.mjs
      - name: Regression suite
        run: |
          node --test \
            tests/masonry-performance-16-7-10.test.mjs \
            tests/performance-16-7-9.test.mjs \
            tests/asset-versioning.test.mjs \
            tests/story-stele-13-15-1.test.mjs

  live-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the published 16.7.10 release
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..16}; do
            if curl -fsSL --max-time 20 https://alantil.ru/ | grep -q 'targetVersion = "16.7.10"'; then
              echo "Published 16.7.10 is reachable."
              exit 0
            fi
            sleep 15
          done
          echo "The published site did not serve version 16.7.10." >&2
          exit 1
      - name: Lighthouse mobile on real pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome)"
          npx --yes lighthouse@12.8.2 --version
          for page in path/oblivion practice profile friends; do
            name="${page//\//-}"
            npx --yes lighthouse@12.8.2 "https://alantil.ru/$page" \
              --only-categories=performance \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json --output-path="perf-results/$name.report.json" --quiet
          done
      - name: Summarize measured data
        if: always()
        shell: bash
        run: |
          node scripts/report-lighthouse.mjs
          cat perf-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alantil-performance-16-7-10
          path: perf-results/
          if-no-files-found: warn
          retention-days: 21
