name: Tower V2 experimental geometry
on:
  push:
    branches: ['17.1', '17.1-stage3-verification', '17.1-stage4-access-qa', '17.1-stage5-masonry', '17.1-stage6-geometry']
    paths:
      - 'packages/tower-game/stone-*v2.mjs'
      - 'packages/tower-game/masonry-v2-*.mjs'
      - 'packages/tower-game/rock-display-winding.mjs'
      - 'src/app/router.js'
      - 'src/shared/styles/lazy/tower.css'
      - 'packages/tower-game/stone-mesh-adapter.mjs'
      - 'packages/tower-game/tower-v2-proposals.mjs'
      - 'src/features/tower/**'
      - 'scripts/qa/browser-tower-v2.cjs'
      - 'scripts/qa/browser-tower-v2-play.cjs'
      - 'tests/tower-v2-*.test.mjs'
      - '.github/workflows/tower-v2-geometry.yml'
  workflow_dispatch:
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standalone v2 geometry tests (actual packed rocks)
        run: node --test tests/tower-v2-*.test.mjs
      - name: All tower regressions (no ignored failures)
        run: node --test tests/tower-*.test.mjs
      - name: Build complete tracked project archive
        run: |
          git archive --format=zip -o AlanTil-17.1-stage3-full-source.zip HEAD
          unzip -t AlanTil-17.1-stage3-full-source.zip | tail -n 1
          git ls-files -z | xargs -0 -n1 stat -c '%n | %s bytes' > FILE_SIZES_BYTES.txt
      - name: Export all source files and sizes
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-17.1-stage3-complete-source
          path: |
            AlanTil-17.1-stage3-full-source.zip
            FILE_SIZES_BYTES.txt
          if-no-files-found: error

  v2-browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Read-only WebGL preview
        run: node scripts/qa/browser-tower-v2.cjs
      - name: Capture preview QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-17.1-stage3-browser-evidence
          path: /tmp/alantil-tower-v2/*.png
          if-no-files-found: warn
