name: Probe 1024 stones for the largest 486-rock wall section
on:
  push:
    branches: ['17.2']
    paths:
      - 'tools/tower/improve-gate-faces-17511.py'
      - 'tools/tower/improve-gate-faces-17512.py'
      - '.github/workflows/tower-gate-faces-17512.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.11.1 pillow==12.3.0
      - name: Probe natural-stone coverage of large 4x4x4 faces with 1024 instances
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/improve-gate-faces-17512.py --kind 4x4x4 --variant 0 --out /tmp/face-1024-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alantil-1024-rocks-face-probe
          path: /tmp/face-1024-probe.json
          if-no-files-found: ignore
