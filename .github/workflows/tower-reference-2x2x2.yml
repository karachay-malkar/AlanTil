name: Bake and review 2x2x2 natural masonry reference
on:
  push:
    branches: [agent/tower-reference-2x2x2-20261017]
    paths:
      - 'tools/tower/build-reference-2x2x2.py'
      - 'tools/tower/verify-reference-2x2x2.py'
      - 'tools/tower/check-reference-triangle-visibility.py'
      - 'tools/tower/fill-reference-visible-gaps.py'
      - 'tools/tower/review-reference-2x2x2.html'
      - '.github/workflows/tower-reference-2x2x2.yml'
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tower-reference-2x2x2-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source mesh tooling
        run: pip install 'numpy==2.2.6' 'scipy==1.15.3' 'trimesh==4.11.1' 'rtree==1.4.1' 'pillow==11.3.0'
      - name: Verify baker parses
        run: python -m py_compile tools/tower/build-reference-2x2x2.py tools/tower/verify-reference-2x2x2.py tools/tower/check-reference-triangle-visibility.py tools/tower/fill-reference-visible-gaps.py
      - name: Produce authentic 2x2x2 stone placements
        run: python -u tools/tower/build-reference-2x2x2.py
      - name: Fill remaining visible gaps using exact triangle-ray checks
        run: python -u tools/tower/fill-reference-visible-gaps.py --samples 64 --limit 70
      - name: Independent full-mesh transforms audit
        run: python tools/tower/verify-reference-2x2x2.py
      - name: Check actual triangles for through-gap rays on all three axes
        run: python -u tools/tower/check-reference-triangle-visibility.py --samples 64
      - name: Verify final QA payload and strict non-promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/tower/prefabs/common94/reference-2x2x2')
          q=json.loads((p/'reference-2x2x2-quality.json').read_text())
          a=json.loads((p/'geometry-validation.json').read_text())
          recipe=json.loads((p/'reference-2x2x2.json').read_text())
          assert q['placements'] == len(recipe['variants']['2x2x2'][0]['placement'])
          assert len(q['afterViews'])==3
          assert q['horizontalShare']>=.50, 'Not dominated by horizontal elongated natural stone'
          assert a['allUniformScale'] and a['allWithinBounds']
          assert a['liveReleaseAllowed'] is False
          ray=json.loads((p/'actual-triangle-visibility.json').read_text())
          assert len(ray['views'])==3
          assert ray['geometry']=='real transformed source triangles'
          assert ray['liveDeploymentPermitted'] is False
          print('EXACT_TRIANGLE_COVERAGE',ray['minimumInternalCoverage'])
          print('EXACT_TRIANGLE_QA_ACCEPTED',ray['passesAt99_5PercentAndAtMost3PixelHole'])
          print('REAL_STONE_REFERENCE_VALIDATED', q['placements'], 'stones')
          print('PROJECTED_INTERIOR_COVERAGE', [(x['axis'],x['interiorCoverage']) for x in q['afterViews']])
          print('LIVE_EDITOR_UNCHANGED')
          PY
      - name: Build complete offline WebGL inspection package
        run: |
          mkdir -p /tmp/reference-2x2x2/three/addons/loaders /tmp/reference-2x2x2/three/addons/controls
          cp src/vendor/three/three.module.js /tmp/reference-2x2x2/three/three.module.js
          cp src/vendor/three/addons/loaders/GLTFLoader.js /tmp/reference-2x2x2/three/addons/loaders/GLTFLoader.js
          cp src/vendor/three/addons/controls/OrbitControls.js /tmp/reference-2x2x2/three/addons/controls/OrbitControls.js
          cp tools/tower/review-reference-2x2x2.html /tmp/reference-2x2x2/index.html
          cp assets/tower/prefabs/common94/common-94.glb /tmp/reference-2x2x2/common-94.glb
          cp assets/tower/prefabs/common94/reference-2x2x2/*.json /tmp/reference-2x2x2/
          cp -a /tmp/reference-2x2x2 ./reference-2x2x2
          zip -qr AlanTil_reference_2x2x2_3D.zip reference-2x2x2
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil_reference_2x2x2_3D
          path: AlanTil_reference_2x2x2_3D.zip
          if-no-files-found: error
      - name: Keep checked pilot recipe and QA only on experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/prefabs/common94/reference-2x2x2/
          if git diff --cached --quiet; then echo 'NO_CHANGE'; else
            git commit -m 'assets(tower): staged real-stone 2x2x2 reference recipe and QA'
            git push origin HEAD:agent/tower-reference-2x2x2-20261017
          fi
