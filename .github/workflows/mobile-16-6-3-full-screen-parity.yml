name: AlanTil 16.6.3 Full Screen Parity

on:
  push:
    branches: [agent/16.6.3-full-screen-parity]
  pull_request:
    branches: [agent/16.6.2-visual-parity]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-screen-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production dictionary snapshot is current
        run: |
          node scripts/generate-mobile-dictionary-snapshot.mjs
          git diff --exit-code -- mobile/data/dictionary-snapshot.json
      - name: Verify bundled snapshot equals production
        run: node scripts/verify-mobile-dictionary-snapshot-parity.mjs
      - name: Portable duplicate audit
        run: node scripts/check-portable-duplicates-16-4-1.mjs
      - name: Shared core regression tests
        run: node --test tests/alantil-core-16.test.mjs tests/progress-sync-policy.test.mjs tests/unified-core-boundary-16.test.mjs
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Mobile executable tests
        working-directory: mobile
        run: npm test
      - name: Mobile RU EN TR hardcode gate
        run: node scripts/check-mobile-i18n-16-6-1.mjs
      - name: Foundation 16.4.1 gate
        run: |
          node scripts/check-completion-matrix.mjs
          node scripts/check-portable-duplicates-16-4-1.mjs
      - name: Functional 16.5 gate
        run: node scripts/check-functional-parity-16-5.mjs
      - name: Preserve 16.6.1 functional gate
        run: node scripts/check-parity-correction-16-6-1.mjs
      - name: Full screen parity 16.6.3 source and state gate
        run: node scripts/check-full-screen-parity-16-6-3.mjs
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Export Expo Web
        working-directory: mobile
        run: npm run export:web
      - name: Prepare portable immutable preview bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          root=Path('mobile/dist-web')
          for p in root.glob('_expo/static/js/web/*.js'):
            t=p.read_text()
            for old,new in (
              ('"./_expo/','"./_expo/'), ('"/_expo/','"./_expo/'),
              ("'./_expo/","'./_expo/"), ("'/_expo/","'./_expo/"),
              ('"./assets/','"./assets/'), ('"/assets/','"./assets/'),
              ("'./assets/","'./assets/"), ("'/assets/","'./assets/"),
            ):
              t=t.replace(old,new)
            p.write_text(t)
          index=root/'index.html'
          t=index.read_text()
          t=t.replace('src="/_expo/','src="./_expo/')
          index.write_text(t)
          (root/'preview-build.json').write_text(json.dumps({
            'source_sha':os.environ.get('GITHUB_SHA',''),
            'branch':os.environ.get('GITHUB_REF_NAME',''),
            'run_id':os.environ.get('GITHUB_RUN_ID',''),
            'version':'16.6.3',
            'delivery':'immutable-cdn-relative',
            'q03':'PUBLIC_RENDER_QA_REQUIRED'
          }),encoding='utf-8')
          PY
      - name: Validate portable browser preview contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('mobile/dist-web')
          index=(root/'index.html').read_text()
          if 'src="./_expo/' not in index:
            raise SystemExit('Preview index does not use a document-relative Expo bundle URL')
          bad=('"/_expo/',"'/_expo/",'"/assets/',"'/assets/")
          for p in root.glob('_expo/static/js/web/*.js'):
            text=p.read_text()
            found=[token for token in bad if token in text]
            if found:
              raise SystemExit(f'{p}: unresolved root-relative Expo paths: {found}')
          print('Portable immutable Expo Web delivery contract: PASS')
          PY
      - name: Package source archive and size manifest
        shell: bash
        run: |
          mkdir -p mobile/dist-web
          git archive --format=zip --output=mobile/dist-web/AlanTil-16.6.3-source.zip HEAD
          python - <<'PY'
          from pathlib import Path
          excluded={'.git','node_modules','dist-web'}
          rows=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or any(part in excluded for part in p.parts):
              continue
            rows.append((p.as_posix(),p.stat().st_size))
          rows.sort()
          Path('mobile/dist-web/FILE_SIZES_16.6.3.txt').write_text('\n'.join(f'{name} — {size/1024:.2f} KB' for name,size in rows)+'\n',encoding='utf-8')
          PY
          sha256sum mobile/dist-web/AlanTil-16.6.3-source.zip > mobile/dist-web/AlanTil-16.6.3-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.6.3-Full-Screen-Parity
          path: mobile/dist-web
          if-no-files-found: error
      - name: Publish immutable Expo Web preview source
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R mobile/dist-web/. "$publish_dir/"
          cd "$publish_dir"
          git init
          git checkout -b preview-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Preview ${GITHUB_SHA}"
          preview_sha="$(git rev-parse HEAD)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:preview-web
          preview_url="https://raw.githack.com/${GITHUB_REPOSITORY}/${preview_sha}/index.html"
          echo "PREVIEW_SHA=${preview_sha}" >> "$GITHUB_ENV"
          echo "PUBLIC_PREVIEW_URL=${preview_url}" >> "$GITHUB_ENV"
          echo "${preview_url}" > "$RUNNER_TEMP/AlanTil-16.6.3-public-preview-url.txt"
          echo "Public preview: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public Expo Web render in Chromium
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          qa_dir="$RUNNER_TEMP/alantil-render-qa"
          mkdir -p "$qa_dir/output"
          cd "$qa_dir"
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          export SCREENSHOT_DIR="$qa_dir/output"
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const url = process.env.PUBLIC_PREVIEW_URL;
            let loaded = false;
            let lastError = '';
            for (let attempt = 0; attempt < 12 && !loaded; attempt += 1) {
              try {
                const response = await page.goto(`${url}?source=${process.env.GITHUB_SHA}&attempt=${attempt}`, { waitUntil: 'networkidle', timeout: 60000 });
                loaded = Boolean(response?.ok());
                if (!loaded) lastError = `HTTP ${response?.status()}`;
              } catch (error) {
                lastError = error.message;
              }
              if (!loaded) await page.waitForTimeout(2500);
            }
            assert.ok(loaded, `Public immutable preview failed to load: ${lastError}`);

            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];
            const badResponses = [];
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('pageerror', error => pageErrors.push(String(error?.stack || error)));
            page.on('requestfailed', request => requestFailures.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'failed'}`));
            page.on('response', response => { if (response.status() >= 400) badResponses.push(`${response.status()} ${response.url()}`); });

            const definitive = await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            assert.ok(definitive?.ok(), `Definitive public preview reload failed: HTTP ${definitive?.status()}`);
            await page.getByText('Язык · Language · Dil', { exact: true }).waitFor({ state: 'visible', timeout: 30000 });
            await page.screenshot({ path: path.join(process.env.SCREENSHOT_DIR, '01-onboarding.png'), fullPage: true });

            await page.getByText('Русский', { exact: true }).click();
            await page.getByText('Написание аланских слов', { exact: true }).waitFor({ state: 'visible' });
            await page.getByText('Кириллица', { exact: true }).click();
            await page.getByText('Выберите форму', { exact: true }).waitFor({ state: 'visible' });
            await page.getByText('Җ', { exact: true }).click();
            await page.screenshot({ path: path.join(process.env.SCREENSHOT_DIR, '02-onboarding-complete.png'), fullPage: true });

            await page.getByText('Продолжить', { exact: true }).click();
            await page.getByText('Продолжить с Google', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('Продолжить как гость', { exact: true }).waitFor({ state: 'visible' });
            await page.screenshot({ path: path.join(process.env.SCREENSHOT_DIR, '03-auth-choice.png'), fullPage: true });

            await page.getByText('Продолжить как гость', { exact: true }).click();
            await page.getByText('Путь', { exact: true }).first().waitFor({ state: 'visible', timeout: 30000 });
            const stele = page.getByTestId('story-stele-card');
            await stele.waitFor({ state: 'visible', timeout: 15000 });
            const box = await stele.boundingBox();
            assert.ok(box, 'Story Stele has no layout box');
            assert.ok(box.y >= -1, `Story Stele starts above viewport: ${JSON.stringify(box)}`);
            assert.ok(box.y + box.height <= 845, `Story Stele is clipped below viewport: ${JSON.stringify(box)}`);
            const paragraph = page.getByTestId('story-stele-paragraph');
            const fontSize = await paragraph.evaluate(node => Number.parseFloat(getComputedStyle(node).fontSize) || 0);
            assert.ok(fontSize >= 12.5, `Story Stele font is too small: ${fontSize}`);
            await page.screenshot({ path: path.join(process.env.SCREENSHOT_DIR, '04-path-stele.png'), fullPage: true });

            await page.waitForTimeout(750);
            const failures = { consoleErrors, pageErrors, requestFailures, badResponses };
            fs.writeFileSync(path.join(process.env.SCREENSHOT_DIR, 'render-qa.json'), JSON.stringify({
              sourceSha: process.env.GITHUB_SHA,
              previewSha: process.env.PREVIEW_SHA,
              url,
              viewport: { width: 390, height: 844 },
              firstRun: 'PASS',
              authChoice: 'PASS',
              guestPath: 'PASS',
              steleBox: box,
              steleFontSize: fontSize,
              ...failures
            }, null, 2));
            assert.deepEqual(failures, { consoleErrors: [], pageErrors: [], requestFailures: [], badResponses: [] }, JSON.stringify(failures, null, 2));
            await browser.close();
            console.log('Public Expo Web Chromium render QA: PASS');
          })().catch(async error => {
            try {
              fs.writeFileSync(path.join(process.env.SCREENSHOT_DIR, 'render-qa-error.txt'), String(error?.stack || error));
            } catch {}
            console.error(error);
            process.exit(1);
          });
          NODE
          cp "$RUNNER_TEMP/AlanTil-16.6.3-public-preview-url.txt" "$qa_dir/output/PUBLIC_PREVIEW_URL.txt"

      - name: Upload public render QA
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.6.3-Web-Render-QA
          path: ${{ runner.temp }}/alantil-render-qa/output
          if-no-files-found: warn
