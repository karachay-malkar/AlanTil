name: AlanTil 16.6.3 Full Screen Parity

on:
  push:
    branches: [agent/16.6.3-full-screen-parity]
  pull_request:
    branches: [agent/16.6.2-visual-parity]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-screen-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production dictionary snapshot is current
        run: |
          node scripts/generate-mobile-dictionary-snapshot.mjs
          git diff --exit-code -- mobile/data/dictionary-snapshot.json
      - name: Verify bundled snapshot equals production
        run: node scripts/verify-mobile-dictionary-snapshot-parity.mjs
      - name: Portable duplicate audit
        run: node scripts/check-portable-duplicates-16-4-1.mjs
      - name: Shared core regression tests
        run: node --test tests/alantil-core-16.test.mjs tests/progress-sync-policy.test.mjs tests/unified-core-boundary-16.test.mjs
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Mobile executable tests
        working-directory: mobile
        run: npm test
      - name: Mobile RU EN TR hardcode gate
        run: node scripts/check-mobile-i18n-16-6-1.mjs
      - name: Foundation 16.4.1 gate
        run: |
          node scripts/check-completion-matrix.mjs
          node scripts/check-portable-duplicates-16-4-1.mjs
      - name: Functional 16.5 gate
        run: node scripts/check-functional-parity-16-5.mjs
      - name: Preserve 16.6.1 functional gate
        run: node scripts/check-parity-correction-16-6-1.mjs
      - name: Full screen parity 16.6.3 source and state gate
        run: node scripts/check-full-screen-parity-16-6-3.mjs
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Export Expo Web
        working-directory: mobile
        run: npm run export:web
      - name: Prepare stable preview metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          root=Path('mobile/dist-web')
          for p in root.glob('_expo/static/js/web/*.js'):
            t=p.read_text()
            t=t.replace('"/_expo/','"./_expo/')
            t=t.replace("'/_expo/","'./_expo/")
            t=t.replace('"/assets/','"./assets/')
            t=t.replace("'/assets/","'./assets/")
            p.write_text(t)
          index=root/'index.html'
          t=index.read_text()
          t=t.replace('src="/_expo/','src="./_expo/')
          index.write_text(t)
          (root/'preview-build.json').write_text(json.dumps({
            'sha':os.environ.get('GITHUB_SHA',''),
            'branch':os.environ.get('GITHUB_REF_NAME',''),
            'run_id':os.environ.get('GITHUB_RUN_ID',''),
            'version':'16.6.3',
            'q03':'RENDER_QA_REQUIRED'
          }),encoding='utf-8')
          PY
      - name: Package source archive and size manifest
        shell: bash
        run: |
          mkdir -p mobile/dist-web
          git archive --format=zip --output=mobile/dist-web/AlanTil-16.6.3-source.zip HEAD
          python - <<'PY'
          from pathlib import Path
          excluded={'.git','node_modules','dist-web'}
          rows=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or any(part in excluded for part in p.parts):
              continue
            rows.append((p.as_posix(),p.stat().st_size))
          rows.sort()
          Path('mobile/dist-web/FILE_SIZES_16.6.3.txt').write_text('\n'.join(f'{name} — {size/1024:.2f} KB' for name,size in rows)+'\n',encoding='utf-8')
          PY
          sha256sum mobile/dist-web/AlanTil-16.6.3-source.zip > mobile/dist-web/AlanTil-16.6.3-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.6.3-Full-Screen-Parity
          path: mobile/dist-web
          if-no-files-found: error
      - name: Publish stable Expo Web preview
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R mobile/dist-web/. "$publish_dir/"
          cd "$publish_dir"
          git init
          git checkout -b preview-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Preview ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:preview-web