name: AlanTil 16.6.3 Full Screen Parity

on:
  push:
    branches: [agent/16.6.3-full-screen-parity]
  pull_request:
    branches: [agent/16.6.2-visual-parity]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-screen-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production dictionary snapshot is current
        run: |
          node scripts/generate-mobile-dictionary-snapshot.mjs
          git diff --exit-code -- mobile/data/dictionary-snapshot.json
      - name: Verify bundled snapshot equals production
        run: node scripts/verify-mobile-dictionary-snapshot-parity.mjs
      - name: Portable duplicate audit
        run: node scripts/check-portable-duplicates-16-4-1.mjs
      - name: Shared core regression tests
        run: node --test tests/alantil-core-16.test.mjs tests/progress-sync-policy.test.mjs tests/unified-core-boundary-16.test.mjs
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Mobile executable tests
        working-directory: mobile
        run: npm test
      - name: Mobile RU EN TR hardcode gate
        run: node scripts/check-mobile-i18n-16-6-1.mjs
      - name: Foundation 16.4.1 gate
        run: |
          node scripts/check-completion-matrix.mjs
          node scripts/check-portable-duplicates-16-4-1.mjs
      - name: Functional 16.5 gate
        run: node scripts/check-functional-parity-16-5.mjs
      - name: Preserve 16.6.1 functional gate
        run: node scripts/check-parity-correction-16-6-1.mjs
      - name: Full screen parity 16.6.3 source and state gate
        run: node scripts/check-full-screen-parity-16-6-3.mjs
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Export Expo Web
        working-directory: mobile
        run: npm run export:web
      - name: Prepare stable preview metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          root=Path('mobile/dist-web')
          base=f'https://raw.githack.com/{os.environ["GITHUB_REPOSITORY"]}/preview-web'
          for p in root.glob('_expo/static/js/web/*.js'):
            t=p.read_text()
            for old in ('"./_expo/', '"/_expo/'):
              t=t.replace(old,'"'+base+'/_expo/')
            for old in ("'./_expo/", "'/_expo/"):
              t=t.replace(old,"'"+base+'/_expo/')
            for old in ('"./assets/', '"/assets/'):
              t=t.replace(old,'"'+base+'/assets/')
            for old in ("'./assets/", "'/assets/"):
              t=t.replace(old,"'"+base+'/assets/')
            p.write_text(t)
          index=root/'index.html'
          t=index.read_text()
          t=t.replace('src="./_expo/','src="'+base+'/_expo/')
          t=t.replace('src="/_expo/','src="'+base+'/_expo/')
          index.write_text(t)
          (root/'preview-build.json').write_text(json.dumps({
            'sha':os.environ.get('GITHUB_SHA',''),
            'branch':os.environ.get('GITHUB_REF_NAME',''),
            'run_id':os.environ.get('GITHUB_RUN_ID',''),
            'version':'16.6.3',
            'delivery':'raw-githack-stable-branch',
            'preview_url':base+'/index.html',
            'q03':'CI_BROWSER_QA_ON_PUBLISH'
          }),encoding='utf-8')
          PY
      - name: Validate browser preview contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root=Path('mobile/dist-web')
          base=f'https://raw.githack.com/{os.environ["GITHUB_REPOSITORY"]}/preview-web'
          index=(root/'index.html').read_text()
          if f'src="{base}/_expo/' not in index:
            raise SystemExit('Preview index does not use the public Expo bundle URL')
          bad=('"./_expo/',"'./_expo/",'"/_expo/',"'/_expo/",'"./assets/',"'./assets/",'"/assets/',"'/assets/")
          for p in root.glob('_expo/static/js/web/*.js'):
            text=p.read_text()
            found=[token for token in bad if token in text]
            if found:
              raise SystemExit(f'{p}: unresolved browser-relative Expo paths: {found}')
          print('Expo Web delivery contract: PASS')
          PY
      - name: Package source archive and size manifest
        shell: bash
        run: |
          mkdir -p mobile/dist-web
          git archive --format=zip --output=mobile/dist-web/AlanTil-16.6.3-source.zip HEAD
          python - <<'PY'
          from pathlib import Path
          excluded={'.git','node_modules','dist-web'}
          rows=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or any(part in excluded for part in p.parts):
              continue
            rows.append((p.as_posix(),p.stat().st_size))
          rows.sort()
          Path('mobile/dist-web/FILE_SIZES_16.6.3.txt').write_text('\n'.join(f'{name} — {size/1024:.2f} KB' for name,size in rows)+'\n',encoding='utf-8')
          PY
          sha256sum mobile/dist-web/AlanTil-16.6.3-source.zip > mobile/dist-web/AlanTil-16.6.3-source.sha256
      - name: Publish stable Expo Web preview
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R mobile/dist-web/. "$publish_dir/"
          cd "$publish_dir"
          git init
          git checkout -b preview-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Preview ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:preview-web
      - name: Verify public Expo Web render in Chromium
        if: github.event_name == 'push'
        shell: bash
        env:
          PREVIEW_URL: https://raw.githack.com/${{ github.repository }}/preview-web/index.html
          PREVIEW_META: https://raw.githack.com/${{ github.repository }}/preview-web/preview-build.json
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            remote_sha="$(curl -fsSL "${PREVIEW_META}?build=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(s).sha||"")}catch{}})' || true)"
            if [ "$remote_sha" = "$GITHUB_SHA" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Public preview did not expose build ${GITHUB_SHA}" >&2
            exit 1
          fi

          qa_dir="$(mktemp -d)"
          cd "$qa_dir"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          export SCREENSHOT_PATH="${GITHUB_WORKSPACE}/mobile/dist-web/render-qa.png"
          node - <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];
            page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('pageerror', (error) => pageErrors.push(String(error?.stack || error)));
            page.on('requestfailed', (request) => requestFailures.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'failed'}`));

            const url = `${process.env.PREVIEW_URL}?build=${process.env.GITHUB_SHA}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || response.status() >= 400) throw new Error(`Preview document returned ${response?.status() ?? 'no response'}`);
            await page.getByText('Язык · Language · Dil', { exact: true }).waitFor({ state: 'visible', timeout: 30000 });
            await page.getByText('Русский', { exact: true }).click();
            await page.getByText('Написание аланских слов', { exact: true }).waitFor({ state: 'visible' });
            await page.getByText('Кириллица', { exact: true }).click();
            await page.getByText('Выберите форму', { exact: true }).waitFor({ state: 'visible' });
            await page.getByText('Җ', { exact: true }).click();
            const continueButton = page.getByText('Продолжить', { exact: true });
            await continueButton.waitFor({ state: 'visible' });
            await continueButton.click();
            await page.getByText('Продолжить с Google', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('Продолжить как гость', { exact: true }).waitFor({ state: 'visible' });
            await page.screenshot({ path: process.env.SCREENSHOT_PATH, fullPage: true });

            await page.waitForTimeout(750);
            if (consoleErrors.length || pageErrors.length || requestFailures.length) {
              throw new Error(JSON.stringify({ consoleErrors, pageErrors, requestFailures }, null, 2));
            }
            fs.writeFileSync(`${process.env.SCREENSHOT_PATH}.json`, JSON.stringify({
              sha: process.env.GITHUB_SHA,
              url,
              firstRun: 'PASS',
              authChoice: 'PASS',
              consoleErrors: 0,
              pageErrors: 0,
              requestFailures: 0
            }, null, 2));
            await browser.close();
            console.log('Public Expo Web Chromium render QA: PASS');
          })().catch(async (error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.6.3-Full-Screen-Parity
          path: mobile/dist-web
          if-no-files-found: error
