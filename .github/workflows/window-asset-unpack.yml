name: Restore authored window GLB
on:
  push:
    branches: [staging/window-bonded-v2-20261015]
    paths:
      - assets/tower/prefabs/architectural/window-4x5x2-v1.glb.xz
      - .github/workflows/window-asset-unpack.yml
permissions:
  contents: write
jobs:
  unpack-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Restore exact authored binary
        run: |
          xz -dc assets/tower/prefabs/architectural/window-4x5x2-v1.glb.xz > assets/tower/prefabs/architectural/window-4x5x2-v1.glb
          echo "7aeb7dc93717f1787418b97f8dccf55ca9a41f1244ffb92832147f765a4dfab1  assets/tower/prefabs/architectural/window-4x5x2-v1.glb" | sha256sum --check
      - name: Validate window asset and editor contracts
        run: |
          node --test tests/window-prefab.test.mjs tests/tower-prefab-placement-17-4.test.mjs tests/tower-prefab-joints-17-5.test.mjs tests/tower-prefab-17-4.test.mjs
      - name: Commit verified binary only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tower/prefabs/architectural/window-4x5x2-v1.glb
          if ! git diff --cached --quiet; then
            git commit -m "Restore original bonded window GLB (SHA-256 verified)"
            git push origin HEAD:staging/window-bonded-v2-20261015
          fi
