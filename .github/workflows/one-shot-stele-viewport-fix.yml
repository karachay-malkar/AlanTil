name: One-shot Story Stele viewport fix

on:
  push:
    branches: [agent/16.6.3-full-screen-parity]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage one-shot Story Stele viewport fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/16.6.3-full-screen-parity
      - name: Apply exact Story Stele viewport fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/screens/path.js')
          s=p.read_text()
          pairs=[
            ("  const cardWidth=Math.max(0,Math.min(width-(width<=360?4:6),height*.53,932));\n  const titleSize=", "  const cardWidth=Math.max(0,Math.min(width-(width<=360?4:6),height*.53,932)),cardHeight=cardWidth*(1688/932);\n  const titleSize="),
            ('<Pressable accessibilityRole="none" onPress={()=>{}} style={[styles.steleCard,{width:cardWidth}]}><Image source={STORY_STELE} resizeMode="contain" style={StyleSheet.absoluteFill}/>', '<Pressable accessibilityRole="none" onPress={()=>{}} style={[styles.steleCard,{width:cardWidth,height:cardHeight}]}><Image source={STORY_STELE} resizeMode="contain" style={styles.steleCardImage}/>'),
            ("steleCard:{position:'relative',aspectRatio:932/1688,alignItems:'center',maxHeight:'96%'},steleCardStar:", "steleCard:{position:'relative',alignItems:'center'},steleCardImage:{position:'absolute',top:0,left:0,width:'100%',height:'100%'},steleCardStar:")
          ]
          for old,new in pairs:
            if old not in s:
              raise SystemExit(f'Expected Story Stele source fragment not found: {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "cardHeight=cardWidth\*(1688/932)" mobile/screens/path.js
          grep -q "steleCardImage:{position:'absolute',top:0,left:0,width:'100%',height:'100%'" mobile/screens/path.js
      - name: Commit viewport fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/screens/path.js
          git commit -m "Fix Story Stele Web viewport sizing"
          git push origin HEAD:agent/16.6.3-full-screen-parity
