name: Probe surface-scored packing from 486 gate rocks
on:
  push:
    branches: ['17.2']
    paths:
      - 'tools/tower/improve-gate-faces-17511.py'
      - '.github/workflows/tower-gate-faces-17511.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.11.1 pillow==12.3.0
      - name: Face-score all 25 stone compositions against six section boundaries
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/improve-gate-faces-17511.py
      - name: Verify 25 different geometries and report actual quality
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('assets/tower/prefabs/balkar71/placements-17_5_11.json')
          p=json.loads(path.read_text())
          assert p['version']=='17.5.11' and len(p['shapes'])==486
          assert len(p['variants'])==5
          rows=[]
          for key,variants in p['variants'].items():
              assert len(variants)==5
              assert len(set(x['sha256'] for x in variants))==5
              for r in variants:
                  assert 1<=r['rocks']<=512
                  assert r['rocks']==len(r['placement'])
                  assert r['occupancy']>=r['beforeOccupancy']
                  assert all(0<=v<=1 for v in r['faceCoverage'])
                  rows.append(r)
          assert len(rows)==25
          print('FACE_SCORE_25_VERIFIED')
          print('WORST_FACE',min(x['minFaceCoverage'] for x in rows))
          print('AVG_WORST_FACE',sum(x['minFaceCoverage'] for x in rows)/25)
          print('AVG_DENSITY',sum(x['occupancy'] for x in rows)/25)
          print('STONES',p['totalPlacements'])
          print('FACE_90_PERCENT',sum(x['minFaceCoverage']>=.90 for x in rows))
          print('VOLUME_90_PERCENT',sum(x['occupancy']>=.90 for x in rows))
          PY
      - name: Publish unapproved 17.5.11 recipe data without changing the app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/prefabs/balkar71/placements-17_5_11.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(tower): face-score 25 gate masonry candidates [skip prefab bake]'
            git pull --rebase origin 17.2
            git push origin HEAD:17.2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alantil-face-scored-25-candidates
          path: assets/tower/prefabs/balkar71/placements-17_5_11.json
          if-no-files-found: ignore
