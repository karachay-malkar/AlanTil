name: Apply 16.6.6 Final Visual Parity

on:
  push:
    branches: [agent/16.6.6-render-qa]
    paths:
      - scripts/apply-profile-guest-parity-16-6-6.mjs
      - .github/workflows/apply-16-6-6-profile-guest-parity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/16.6.6-render-qa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic final visual correction
        run: node scripts/apply-profile-guest-parity-16-6-6.mjs
      - name: Commit full corrected source
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            mobile/screens/path.js
            mobile/screens/station.js
            mobile/ui/components.js
            mobile/ui/guide.js
            mobile/screens/learn.js
            mobile/screens/station-test.js
            mobile/screens/profile-main.js
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo "Final visual parity source already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${FILES[@]}"
          git commit -m "Close final Web 13.15.12 render parity gaps"
          git push origin HEAD:agent/16.6.6-render-qa
