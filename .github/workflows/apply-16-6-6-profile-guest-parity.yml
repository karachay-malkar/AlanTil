name: Apply 16.6.6 Render QA Locator Fix

on:
  push:
    branches: [agent/16.6.6-render-qa]
    paths:
      - .github/workflows/apply-16-6-6-profile-guest-parity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/16.6.6-render-qa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Station tab locator correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-mobile-visual-parity-16-6-6.cjs')
          s=p.read_text()
          old="await capture('20-station-words');if(isReference){await page.locator('[data-station-tab=\"statistics\"]').click();}else await clickExact(page,'Статистика');await page.waitForTimeout(250);await capture('21-station-statistics');if(isReference){await page.locator('[data-station-tab=\"menu\"]').click();}else await clickExact(page,'Меню');"
          new="await capture('20-station-words');if(isReference){await page.locator('[data-station-tab=\"statistics\"]').click();}else{const statisticsTab=page.getByRole('button',{name:/Статистика/}).first();await statisticsTab.waitFor({state:'visible',timeout:15000});await statisticsTab.click();}await page.waitForTimeout(250);await capture('21-station-statistics');if(isReference){await page.locator('[data-station-tab=\"menu\"]').click();}else{const menuTab=page.getByRole('button',{name:/Меню/}).first();await menuTab.waitFor({state:'visible',timeout:15000});await menuTab.click();}"
          if old in s:
              p.write_text(s.replace(old,new))
          elif new not in s:
              raise SystemExit('Render QA locator source mismatch')
          PY
          node --check scripts/qa-mobile-visual-parity-16-6-6.cjs
      - name: Commit corrected Render QA harness
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/qa-mobile-visual-parity-16-6-6.cjs; then
            echo "Render QA locator already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa-mobile-visual-parity-16-6-6.cjs
          git commit -m "Fix canonical Station tab traversal in Render QA"
          git push origin HEAD:agent/16.6.6-render-qa
