name: AlanTil 16.0 Clean Core CI

on:
  push:
    branches:
      - agent/16.0-clean-web-core
  workflow_dispatch:

jobs:
  core-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Shared core frozen parity tests
        run: node --test tests/alantil-core-16.test.mjs

      - name: Architecture boundary tests
        run: node --test tests/unified-core-boundary-16.test.mjs

      - name: Web behavioral regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/i18n-runtime.test.mjs \
            tests/word-normalization.test.mjs \
            tests/word-progress.test.mjs \
            tests/station-test-contract.test.mjs \
            tests/visitor-analytics.test.mjs \
            tests/navigation-intent.test.mjs \
            tests/sync-queue.test.mjs \
            tests/session-exit-phrase.test.mjs

      - name: Verify Web remains the 13.15.12 reference UI
        shell: bash
        run: |
          grep -q 'targetVersion = "13.15.12"' index.html
          grep -q '/src/app/bootstrap.js?v=13.15.12' index.html
          test -f src/features/path/index.js
          test -f src/features/test/engine.js
          test -f src/features/match/engine.js
          test -f src/features/learn/study.js
