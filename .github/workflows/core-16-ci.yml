name: AlanTil 16.0 Clean Core CI

on:
  push:
    branches:
      - agent/16.0-clean-web-core
  workflow_dispatch:

jobs:
  core-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Shared core frozen parity tests
        run: node --test tests/alantil-core-16.test.mjs

      - name: Architecture boundary tests
        run: node --test tests/unified-core-boundary-16.test.mjs

      - name: Web behavioral regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort | grep -Ev '(admin-activity-13-15-10|asset-versioning|content-hierarchy-13-13|content-hierarchy-13-14|navigation-performance|onboarding-setup|path-route-layout-13-15-12|profile-navigation-overflow-13-15-12|screen-stability-13-15|settings-language-switch|story-stele-13-15-1|typography-13-15-12|alantil-core-16|unified-core-boundary-16)')
          node --test "${tests[@]}"

      - name: Verify Web remains the 13.15.12 reference UI
        shell: bash
        run: |
          grep -q 'targetVersion = "13.15.12"' index.html
          grep -q '/src/app/bootstrap.js?v=13.15.12' index.html
          test -f src/features/path/index.js
          test -f src/features/test/engine.js
          test -f src/features/match/engine.js
          test -f src/features/learn/study.js
