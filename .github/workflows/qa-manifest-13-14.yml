name: Final QA and manifest 13.14

on:
  push:
    branches:
      - "13.14"

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "13.14"
      - name: Run tests and build final manifest
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > QA_13.14.txt 2>&1
          status=$?
          printf '\nEXIT_CODE=%s\n' "$status" >> QA_13.14.txt
          set -e
          python - <<'PY'
          from pathlib import Path

          excluded = {
              '.github/workflows/qa-manifest-13-14.yml',
              '.github/qa-trigger-13-14.txt',
              'QA_13.14.txt',
              'FILE_SIZES_13.14.txt',
          }
          manifest = 'FILE_SIZES_13.14.txt'
          rows = []
          base_total = 0
          for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts:
                  continue
              rel = p.as_posix().removeprefix('./')
              if rel in excluded:
                  continue
              size = p.stat().st_size
              base_total += size
              rows.append((rel, size))

          def render(self_size):
              total = base_total + self_size
              out = [
                  f'FILES\t{len(rows) + 1}',
                  f'TOTAL_BYTES\t{total}',
                  f'TOTAL_KB\t{total / 1024:.2f}',
              ]
              out.extend(f'{rel}\t{size}\t{size / 1024:.2f} KB' for rel, size in rows)
              out.append(f'{manifest}\t{self_size}\t{self_size / 1024:.2f} KB')
              return '\n'.join(out) + '\n'

          self_size = 0
          for _ in range(20):
              content = render(self_size)
              next_size = len(content.encode('utf-8'))
              if next_size == self_size:
                  break
              self_size = next_size
          content = render(self_size)
          Path(manifest).write_text(content, encoding='utf-8')
          assert Path(manifest).stat().st_size == self_size
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QA_13.14.txt FILE_SIZES_13.14.txt
          git commit -m 'chore: generated 13.14 QA report and delivery manifest'
          git push origin HEAD:13.14
          exit "$status"
