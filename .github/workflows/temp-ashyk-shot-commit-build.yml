name: temp ashyk shot commit build
on:
  push:
    branches:
      - agent/16.8.0-shot-commit-build
permissions:
  contents: write

jobs:
  build-test-generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expose vendored dependencies
        run: ln -s tools/ashyk-web/node_modules node_modules
      - name: Prepare build references
        run: |
          rm -f temp-ashyk-test.log temp-ashyk-test-exit.txt
          python3 - <<'PY'
          import pathlib, subprocess
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw:
                  continue
              p=pathlib.Path(raw.decode())
              try:
                  text=p.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              if '16.8.0.2' in text:
                  p.write_text(text.replace('16.8.0.2','16.8.0.3'))
          PY
      - name: Build Ashyk web runtime
        run: node tools/ashyk-web/build.mjs
      - name: Ashyk trajectory smoke
        run: node scripts/qa/ashyk-trajectory-smoke.mjs
      - name: Ashyk regression tests
        run: node --test tests/ashyk-online-authority-16-7.test.mjs tests/ashyk-shot-replication-16-7.test.mjs tests/social-ashyk-16-7-0.test.mjs tests/release-version-16-7.test.mjs
      - name: Verify generated runtime
        run: node scripts/qa/check-generated.mjs --ashyk
      - name: Remove dependency symlink
        run: rm -f node_modules
      - name: Stage generated runtime and build references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
      - name: Commit generated runtime and build references
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "temp: generate Ashyk runtime 16.8.0.3"
          fi
      - name: Push generated runtime and build references
        run: git push origin "HEAD:$GITHUB_REF_NAME"
