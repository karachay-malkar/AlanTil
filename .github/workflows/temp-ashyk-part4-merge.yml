name: Temp Ashyk Part 4 Merge

on:
  push:
    branches:
      - agent/tdd-ashyk-part1-20260930

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified payload
        run: |
          cat .ashyk-part4-payload.part* > .ashyk-part4-payload.tgz
          echo "dcd9859d67e7d50b6328e2f295daa1d149a99e4c01fd630f2a3f543ad4f8e633  .ashyk-part4-payload.tgz" | sha256sum -c -
          tar -xzf .ashyk-part4-payload.tgz
          rm -f .ashyk-part4-payload.part* .ashyk-part4-payload.tgz
          rm -f .github/workflows/temp-ashyk-part4-merge.yml
      - name: Rebuild Web runtime
        run: node tools/ashyk-web/build.mjs
      - name: Verify Ashyk contracts
        run: |
          node --test \
            tests/ashyk-computer-part1-16-8.test.mjs \
            tests/ashyk-word-scopes-16-8.test.mjs \
            tests/ashyk-friend-auth-16-8.test.mjs \
            tests/ashyk-recovery-16-8.test.mjs \
            tests/ashyk-online-authority-16-7.test.mjs \
            tests/ashyk-single-room-16-8.test.mjs \
            tests/ashyk-part4-integration-16-8.test.mjs \
            tests/ashyk-web-parity-16-6-13.test.mjs \
            tests/ashyk-shot-replication-16-7.test.mjs \
            mobile/tests/ashyk-ui-help-16-6-12.test.mjs \
            mobile/tests/architecture.test.mjs
          node scripts/enforce-registered-ashyk-modes-16-7.mjs
          node scripts/sync-visual-contract-16-7.mjs --check
      - name: Commit assembled tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "temp: assemble Ashyk Part 4"
      - name: Create full archive
        run: git archive --format=zip --output=/tmp/AlanTil-16.8.0.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.8.0-final
          path: /tmp/AlanTil-16.8.0.zip
          compression-level: 0
      - name: Push assembled tree
        run: git push origin HEAD:agent/tdd-ashyk-part1-20260930
