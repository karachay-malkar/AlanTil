name: Temporary refresh Ashyk runtime

on:
  push:
    branches: [agent/refresh-ashyk-runtime-16.8.0.9]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Ashyk builder
        run: npm ci --no-audit --no-fund
        working-directory: tools/ashyk-web
      - name: Build generated runtime
        run: node tools/ashyk-web/build.mjs
      - name: Commit runtime when changed
        run: |
          if git diff --quiet -- src/features/ashyk/runtime.js; then
            echo "Runtime already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ashyk/runtime.js
          git commit -m "ashyk-runtime-refreshed"
          git push
