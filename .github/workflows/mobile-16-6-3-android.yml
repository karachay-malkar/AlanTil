name: AlanTil 16.6.3 Android

on:
  push:
    branches: [agent/16.6.3-full-screen-parity]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Mobile executable tests
        working-directory: mobile
        run: npm test
      - name: Preserve 16.6.1 functional gate
        run: node scripts/check-parity-correction-16-6-1.mjs
      - name: Full screen parity 16.6.3 source and state gate
        run: node scripts/check-full-screen-parity-16-6-3.mjs
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Verify Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Package APK
        shell: bash
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk AlanTil-16.6.3.apk
          sha256sum AlanTil-16.6.3.apk > AlanTil-16.6.3.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.6.3-APK
          path: |
            AlanTil-16.6.3.apk
            AlanTil-16.6.3.apk.sha256
          if-no-files-found: error
