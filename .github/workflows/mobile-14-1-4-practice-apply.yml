name: Apply AlanTil 14.1.4 Practice

on:
  push:
    branches:
      - agent/14.1-mobile-foundation
    paths:
      - '.github/workflows/mobile-14-1-4-practice-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and apply practice patch
        shell: bash
        run: |
          cat \
            .github/patches/mobile-14-1-4-practice.part00 \
            .github/patches/mobile-14-1-4-practice.part01 \
            .github/patches/mobile-14-1-4-practice.part02 \
            .github/patches/mobile-14-1-4-practice.part03 \
            .github/patches/mobile-14-1-4-practice.part04 \
            .github/patches/mobile-14-1-4-practice.part05 \
            | base64 -d > /tmp/mobile-14-1-4-practice.zip
          unzip -t /tmp/mobile-14-1-4-practice.zip
          unzip -oq /tmp/mobile-14-1-4-practice.zip -d .
          git status --short

      - name: Commit practice implementation
        shell: bash
        run: |
          git config user.name taulu
          git config user.email taulantau5@gmail.com
          git add mobile .github/workflows/mobile-14-1-android.yml .github/workflows/mobile-14-1-source.yml
          git diff --cached --quiet && exit 0
          git commit -m "14.1.4: add native practice modes"
          git push origin HEAD:${GITHUB_REF_NAME}
