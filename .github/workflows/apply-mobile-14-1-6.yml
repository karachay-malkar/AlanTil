name: Apply AlanTil 14.1.6 architecture
on:
  push:
    branches: [agent/14.1-mobile-foundation]
    paths: ['.github/workflows/apply-mobile-14-1-6.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/14.1-mobile-foundation
      - name: Apply audited 14.1.6 patch
        shell: bash
        run: |
          cat > /tmp/patch.b64 <<'PATCH'
[truncated]
PATCH
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/14.1.6.patch
          git apply --check /tmp/14.1.6.patch
          git apply /tmp/14.1.6.patch
          rm .github/workflows/apply-mobile-14-1-6.yml
          git config user.name 'taulu'
          git config user.email 'taulantau5@gmail.com'
          git add -A
          git commit -m '14.1.6: complete mobile learning architecture'
          git push origin HEAD:agent/14.1-mobile-foundation
