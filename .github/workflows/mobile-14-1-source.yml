name: Package AlanTil Mobile Source

on:
  push:
    branches:
      - agent/14.2-mobile-parity
      - agent/15.0-unified-core
    paths:
      - 'mobile/**'
      - 'packages/**'
      - 'src/shared/**'
      - '.github/workflows/mobile-14-1-android.yml'
      - '.github/workflows/mobile-14-1-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate release metadata
        id: release
        run: node mobile/scripts/release-metadata.mjs >> "$GITHUB_OUTPUT"

      - name: Package complete mobile source
        shell: bash
        env:
          ALANTIL_SOURCE_PREFIX: ${{ steps.release.outputs.source_prefix }}
          ALANTIL_SOURCE_FILENAME: ${{ steps.release.outputs.source_filename }}
        run: |
          git archive --format=zip --prefix="$ALANTIL_SOURCE_PREFIX/" \
            --output="$ALANTIL_SOURCE_FILENAME" HEAD mobile packages src/shared \
            .github/workflows/mobile-14-1-android.yml \
            .github/workflows/mobile-14-1-source.yml

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.source_artifact }}
          path: ${{ steps.release.outputs.source_filename }}
          if-no-files-found: error
          retention-days: 14
