name: QA compact masonry 17.5.5
on:
  push:
    branches: ['17.2']
    paths:
      - 'assets/tower/prefabs/balkar71/**'
      - 'assets/tower/prefabs/manifest.json'
      - 'src/features/tower/**'
      - 'src/app/router.js'
      - 'packages/tower-game/**'
      - 'tests/compact-stones-1755.test.mjs'
      - 'supabase/migrations/20261017000000_tower_compact_stones_1755.sql'
      - '.github/workflows/tower-compact-1755-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  js-and-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete editor and compact 3D library
        run: |
          node --check src/features/tower/index.js
          node --check src/features/tower/prefab-scene.js
          node --check src/features/tower/compact-stone-scene.js
          node --check src/app/router.js
          node --check packages/tower-game/compact-stone-prefab.mjs
          node --test tests/compact-stones-1755.test.mjs tests/tower-gate-stones-1754.test.mjs
          node --test tests/tower-*.test.mjs tests/gate-prefab.test.mjs tests/window-prefab.test.mjs tests/door-prefab.test.mjs
  postgres-versions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tower_ci_only
          POSTGRES_DB: tower_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tower_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: tower_ci_only
      PGDATABASE: tower_ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply historical and new server V3 migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/tower_v3_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261014080000_tower_v3_free_prefab_sections.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261014130000_tower_v3_prefab_library_1752.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261015140000_tower_window_prefab_176.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261015221000_tower_door_prefab_176.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016135500_tower_wild_prefab_1753.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016181500_tower_gate_prefab_176.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016200000_tower_gate_stones_1754.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261017000000_tower_compact_stones_1755.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE v jsonb;
          BEGIN
            v:=private.tower_v3_canonical('{"id":"00000000-0000-4000-8000-000000000001","sectionId":"4x4x4","geometryVersion":"17.5.5","variant":4,"rotation":0,"x":0,"y":0,"z":0}'::jsonb);
            IF v->>'geometryVersion' <> '17.5.5' THEN RAISE EXCEPTION '17.5.5 not accepted';END IF;
            v:=private.tower_v3_canonical('{"id":"00000000-0000-4000-8000-000000000001","sectionId":"4x4x4","geometryVersion":"17.5.4","variant":4,"rotation":0,"x":0,"y":0,"z":0}'::jsonb);
            IF v->>'geometryVersion' <> '17.5.4' THEN RAISE EXCEPTION 'old saves unsupported';END IF;
          END $$;
          SQL
