name: Inspect current word text table safely

on:
  push:
    branches:
      - ops/word-sync-2026-08-08
    paths:
      - .github/workflows/inspect-word-text-table.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/word-sync-2026-08-08
      - name: Read table samples and method metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          base = "https://pybrzgedqjmosbmilcea.supabase.co/rest/v1"
          key = "sb_publishable_11TY-fBEAogA9JKnAku3vg_hjRxTa_a"
          out = Path("ops_live_export/table_inspect")
          out.mkdir(parents=True, exist_ok=True)

          def req(url, method="GET", body=None, headers=None):
              h = {"apikey": key, "Accept": "application/json"}
              if headers: h.update(headers)
              data = None if body is None else json.dumps(body).encode("utf-8")
              if data is not None: h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, headers=h, data=data, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=20) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
                      return {"status": resp.status, "headers": dict(resp.headers.items()), "body": raw}
              except Exception as exc:
                  raw = ""
                  if hasattr(exc, "read"):
                      try: raw = exc.read().decode("utf-8", errors="replace")
                      except Exception: pass
                  return {"status": getattr(exc, "code", 0) or 0, "error": str(exc), "body": raw}

          relations = ["content_word_texts", "content_words", "content_dictionaries", "content_sections", "content_sets"]
          report = {}
          for rel in relations:
              q = urllib.parse.urlencode({"select": "*", "limit": "5"})
              report[rel] = req(f"{base}/{rel}?{q}")
              report[rel]["body"] = report[rel].get("body", "")[:8000]
              report[rel + "_options"] = req(f"{base}/{rel}", method="OPTIONS")
              report[rel + "_options"]["body"] = report[rel + "_options"].get("body", "")[:2000]
          (out / "table_samples.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Commit inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops_live_export/table_inspect
          git diff --cached --quiet && exit 0
          git commit -m "ops: inspect current word text table"
          git push origin HEAD:ops/word-sync-2026-08-08
