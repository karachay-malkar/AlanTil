name: Compare merge regression names

'on':
  push:
    branches:
      - agent/verify-16.8.0-50145add

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare failure names
        shell: bash
        run: |
          set +e
          git checkout --detach 8a728b82955706ceef364ec16de43fc89970c685
          node --test --test-reporter=tap tests/*.test.mjs mobile/tests/*.test.mjs > /tmp/base.tap 2>&1
          grep '^not ok ' /tmp/base.tap | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/base.failures

          git checkout --detach 50145add45819a812f87e8ce1a64b4a7c7e24d11
          node --test --test-reporter=tap tests/*.test.mjs mobile/tests/*.test.mjs > /tmp/head.tap 2>&1
          grep '^not ok ' /tmp/head.tap | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/head.failures

          echo '=== BASE SUMMARY ==='
          tail -n 9 /tmp/base.tap
          echo '=== HEAD SUMMARY ==='
          tail -n 9 /tmp/head.tap
          echo '=== NEW FAILURE NAMES ==='
          comm -13 /tmp/base.failures /tmp/head.failures
          echo '=== RESOLVED FAILURE NAMES ==='
          comm -23 /tmp/base.failures /tmp/head.failures
          exit 0
