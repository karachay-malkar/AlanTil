name: Compare pre-merge QA baseline

'on':
  push:
    branches:
      - agent/verify-16.8.0-50145add

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8a728b82955706ceef364ec16de43fc89970c685
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baseline QA
        shell: bash
        run: |
          set +e
          npm run qa:final > /tmp/base-qa.log 2>&1
          echo "qa_exit=$?"
          tail -n 100 /tmp/base-qa.log
          exit 0
      - name: Baseline focused affected tests
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap tests/visual-parity-16-7-0.test.mjs tests/social-ashyk-16-7-0.test.mjs > /tmp/base-affected.tap 2>&1
          echo "affected_exit=$?"
          tail -n 70 /tmp/base-affected.tap
          exit 0
      - name: Baseline broad suite
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap tests/*.test.mjs mobile/tests/*.test.mjs > /tmp/base-full.tap 2>&1
          echo "full_exit=$?"
          tail -n 20 /tmp/base-full.tap
          exit 0
