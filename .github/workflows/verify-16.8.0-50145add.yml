name: Verify AlanTil 16.8.0 merged head

'on':
  push:
    branches:
      - agent/verify-16.8.0-50145add

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50145add45819a812f87e8ce1a64b4a7c7e24d11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact source
        shell: bash
        run: |
          set -e
          echo "expected=50145add45819a812f87e8ce1a64b4a7c7e24d11"
          echo "actual=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "50145add45819a812f87e8ce1a64b4a7c7e24d11"
          test -z "$(git status --porcelain)"

      - name: Final QA on clean tree
        shell: bash
        run: |
          set +e
          npm run qa:final > "$RUNNER_TEMP/qa-final.log" 2>&1
          code=$?
          echo "$code" > "$RUNNER_TEMP/qa-final.exit"
          tail -n 100 "$RUNNER_TEMP/qa-final.log"
          exit 0

      - name: Prepare verification output
        shell: bash
        run: |
          mkdir -p verification
          cp "$RUNNER_TEMP/qa-final.log" verification/qa-final.log
          echo "exit_code=$(cat "$RUNNER_TEMP/qa-final.exit")" > verification/qa-final-exit.txt
          {
            echo "expected=50145add45819a812f87e8ce1a64b4a7c7e24d11"
            echo "actual=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
          } > verification/source.txt

      - name: Focused Ashyk integration - exact Part 4 set
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap \
            tests/ashyk-computer-part1-16-8.test.mjs \
            tests/ashyk-word-scopes-16-8.test.mjs \
            tests/ashyk-friend-auth-16-8.test.mjs \
            tests/ashyk-recovery-16-8.test.mjs \
            tests/ashyk-online-authority-16-7.test.mjs \
            tests/ashyk-single-room-16-8.test.mjs \
            tests/ashyk-part4-integration-16-8.test.mjs \
            tests/ashyk-web-parity-16-6-13.test.mjs \
            tests/ashyk-shot-replication-16-7.test.mjs \
            mobile/tests/ashyk-ui-help-16-6-12.test.mjs \
            mobile/tests/architecture.test.mjs > verification/ashyk-suite.tap 2>&1
          code=$?
          echo "exit_code=$code" > verification/ashyk-exit.txt
          tail -n 35 verification/ashyk-suite.tap
          exit 0

      - name: Visual contract
        shell: bash
        run: |
          set +e
          node scripts/sync-visual-contract-16-7.mjs --check > verification/visual-contract.log 2>&1
          code=$?
          echo "exit_code=$code" >> verification/visual-contract.log
          cat verification/visual-contract.log
          exit 0

      - name: Ashyk access invariants
        shell: bash
        run: |
          set +e
          node scripts/enforce-registered-ashyk-modes-16-7.mjs > verification/access-invariants.log 2>&1
          code=$?
          echo "exit_code=$code" >> verification/access-invariants.log
          cat verification/access-invariants.log
          exit 0

      - name: Full repository Node test suite
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap tests/*.test.mjs mobile/tests/*.test.mjs > verification/full-suite.tap 2>&1
          code=$?
          echo "exit_code=$code" > verification/full-suite-exit.txt
          tail -n 35 verification/full-suite.tap
          exit 0

      - name: Build verification report and source archive
        shell: bash
        run: |
          set -e
          node <<'NODE'
          const fs=require('fs');
          function parseTap(path){
            const s=fs.readFileSync(path,'utf8');
            const pick=(name)=>{const m=s.match(new RegExp('^# '+name+'\\s+(\\d+)','m'));return m?Number(m[1]):null};
            return {tests:pick('tests'),pass:pick('pass'),fail:pick('fail'),skipped:pick('skipped'),cancelled:pick('cancelled'),todo:pick('todo')};
          }
          const readExit=p=>Number((fs.readFileSync(p,'utf8').match(/exit_code=(\d+)/)||[])[1]??-1);
          const readTaggedExit=p=>Number((fs.readFileSync(p,'utf8').match(/exit_code=(\d+)/)||[])[1]??-1);
          const report={
            commit: require('child_process').execSync('git rev-parse HEAD',{encoding:'utf8'}).trim(),
            tree: require('child_process').execSync('git rev-parse HEAD^{tree}',{encoding:'utf8'}).trim(),
            ashyk:{...parseTap('verification/ashyk-suite.tap'),exit_code:readExit('verification/ashyk-exit.txt')},
            full:{...parseTap('verification/full-suite.tap'),exit_code:readExit('verification/full-suite-exit.txt')},
            visual_contract_exit_code:readTaggedExit('verification/visual-contract.log'),
            access_invariants_exit_code:readTaggedExit('verification/access-invariants.log'),
            qa_final_exit_code:readExit('verification/qa-final-exit.txt')
          };
          fs.writeFileSync('verification/summary.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE

          git diff --name-only 8a728b82955706ceef364ec16de43fc89970c685 50145add45819a812f87e8ce1a64b4a7c7e24d11 > verification/changed-files.txt
          : > verification/changed-file-sizes.txt
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              bytes=$(stat -c%s "$f")
              awk -v f="$f" -v b="$bytes" 'BEGIN{printf "%s — %.2f KB (%d bytes)\n",f,b/1024,b}' >> verification/changed-file-sizes.txt
            fi
          done < verification/changed-files.txt

          git archive --format=zip --output=AlanTil-16.8.0-final-50145add.zip 50145add45819a812f87e8ce1a64b4a7c7e24d11
          unzip -t AlanTil-16.8.0-final-50145add.zip > verification/archive-test.txt
          sha256sum AlanTil-16.8.0-final-50145add.zip | tee verification/archive-sha256.txt
          stat -c '%s' AlanTil-16.8.0-final-50145add.zip | tee verification/archive-size-bytes.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlanTil-16.8.0-final-verification-50145add-r2
          path: |
            AlanTil-16.8.0-final-50145add.zip
            verification/
          if-no-files-found: error
          retention-days: 7

      - name: Verification gate
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('verification/summary.json','utf8'));
          const problems=[];
          if(r.commit!=='50145add45819a812f87e8ce1a64b4a7c7e24d11') problems.push('wrong commit');
          if(r.ashyk.exit_code!==0 || r.ashyk.fail!==0) problems.push('focused Ashyk suite failed');
          if(r.visual_contract_exit_code!==0) problems.push('visual contract failed');
          if(r.access_invariants_exit_code!==0) problems.push('access invariants failed');
          if(r.qa_final_exit_code!==0) problems.push('qa:final failed');
          if(r.full.tests!==643 || r.full.fail!==103) problems.push('full-suite baseline changed');
          if(problems.length){console.error(problems.join('\n'));process.exit(1);}
          console.log('Verification gate passed.');
          NODE
