name: Finish Ashyk runtime and typography

on:
  push:
    branches:
      - agent/16.8.0

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/16.8.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate shared visual tokens
        run: node scripts/generate-shared-visual-css.mjs
      - name: Rebuild Ashyk runtime from Game.jsx
        run: node tools/ashyk-web/build.mjs
      - name: Synchronize generated parity contracts
        run: |
          node scripts/sync-mobile-parity-16-7.mjs
          node scripts/sync-visual-contract-16-7.mjs
      - name: Stage generated result as final candidate
        run: |
          rm .github/workflows/ashyk-typography-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "16.8.0: rebuild Ashyk runtime and finalize typography"
      - name: Syntax-check generated runtime
        run: node --check src/features/ashyk/runtime.js
      - name: Test typography contract
        run: node --test tests/typography-13-15-12.test.mjs
      - name: Test settings persistence
        run: node --test tests/user-settings-store.test.mjs
      - name: Test asset versioning
        run: node --test tests/asset-versioning.test.mjs
      - name: Test release version
        run: node --test tests/release-version-16-7.test.mjs
      - name: Test Ashyk computer contract
        run: node --test tests/ashyk-computer-part1-16-8.test.mjs
      - name: Test Ashyk friend auth
        run: node --test tests/ashyk-friend-auth-16-8.test.mjs
      - name: QA architecture
        run: node --test tests/unified-core-boundary-16.test.mjs mobile/tests/architecture.test.mjs
      - name: QA shared core
        run: node --test tests/alantil-core-16.test.mjs tests/web-progress-queue-race.test.mjs tests/web-progress-attempt-race.test.mjs tests/dictionary-cache-migration-16-8.test.mjs mobile/tests/cloud-queue-race.test.mjs mobile/tests/cloud-scope-transaction.test.mjs
      - name: QA Web visual parity
        run: node --test tests/visual-parity-16-7-0.test.mjs
      - name: QA Web style cache
        run: node --test tests/web-style-cache-resilience-16-7-0.test.mjs
      - name: QA Web first-run guide
        run: node --test tests/first-run-guide-stella-16-7-0.test.mjs
      - name: QA Mobile regressions
        run: node --test mobile/tests/practice-mechanics-parity-16-6-7.test.mjs mobile/tests/mobile-polish-16-6-8.test.mjs
      - name: QA auth and session
        run: node --test tests/web-auth-cache-16-7-0.test.mjs tests/auth-pkce-session.test.mjs tests/web-guest-claim-16-8.test.mjs
      - name: QA social and community
        run: node --test tests/friends-web-parity-16-7-0.test.mjs tests/visitor-analytics.test.mjs tests/storage-profile-analytics-16-8.test.mjs tests/station-test-exit-contract-16-8.test.mjs tests/station-test-scope.test.mjs tests/session-exit-phrase.test.mjs tests/admin-activity-13-15-10.test.mjs
      - name: QA Ashyk suite
        run: node --test tests/social-ashyk-16-7-0.test.mjs tests/ashyk-online-authority-16-7.test.mjs tests/ashyk-shot-replication-16-7.test.mjs tests/ashyk-wood-board-16-7-0.test.mjs mobile/tests/ashyk-ui-help-16-6-12.test.mjs
      - name: Run final repository QA
        run: npm run qa:final
      - name: Push verified final commit
        run: git push origin HEAD:agent/16.8.0
