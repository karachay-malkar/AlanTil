name: Alan Til 16.6.9 Ashyk integration

on:
  push:
    branches: [agent/16.6.9-ashyk-practice]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Integration contracts
        run: node --test tests/ashyk-integration-16-6-9.test.mjs mobile/tests/ashyk-integration-16-6-9.test.mjs
      - name: Existing Practice regression
        run: node --test mobile/tests/practice-mechanics-parity-16-6-7.test.mjs mobile/tests/mobile-polish-16-6-8.test.mjs
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Verify Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Package APK and source
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk AlanTil-16.6.9.apk
          sha256sum AlanTil-16.6.9.apk > AlanTil-16.6.9.apk.sha256
          git archive --format=zip --output=AlanTil-16.6.9-source.zip HEAD
          sha256sum AlanTil-16.6.9-source.zip > AlanTil-16.6.9-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.6.9-Ashyk
          path: |
            AlanTil-16.6.9.apk
            AlanTil-16.6.9.apk.sha256
            AlanTil-16.6.9-source.zip
            AlanTil-16.6.9-source.zip.sha256
          if-no-files-found: error
