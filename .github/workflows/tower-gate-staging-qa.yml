name: Approved gate v7 staged integration QA
on:
  push:
    branches: [agent/gate-v7-install-ready-20261016]
    paths: [.github/workflows/tower-gate-staging-qa.yml, assets/tower/prefabs/architectural/gate-18x10x2-v7.glb, tests/tower-prefab-placement-17-4.test.mjs, tests/gate-prefab.test.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-geometry-and-preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate-v7-install-ready-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript lint and preexisting behavior
        run: |
          node --check src/features/tower/index.js
          node --check src/features/tower/prefab-scene.js
          node --check src/features/tower/gate-surface.js
          node --check packages/tower-game/gate-prefab.mjs
          node --test tests/tower-*.test.mjs tests/door-prefab.test.mjs tests/window-prefab.test.mjs
      - name: Gate dimensions, rotations, aperture and SQL compatibility
        run: |
          node --test --test-name-pattern='^(?!approved full v7 GLB is present)' tests/gate-prefab.test.mjs
      - name: Verify exact uploaded GLB and full gate suite
        if: hashFiles('assets/tower/prefabs/architectural/gate-18x10x2-v7.glb') != ''
        run: |
          node --test tests/gate-prefab.test.mjs
          python3 - <<'PY'
          import pathlib,hashlib,struct
          p=pathlib.Path('assets/tower/prefabs/architectural/gate-18x10x2-v7.glb')
          d=p.read_bytes()
          assert len(d)==5753348,('expected approved v7 GLB',len(d))
          assert d[:4]==b'glTF' and struct.unpack('<I',d[8:12])[0]==len(d)
          assert hashlib.sha256(d).hexdigest()=='37dc0aee3bead89dba3ed5427af604c09340db0ede15ece139f9016fc920ba51'
          print('GATE_V7_BINARY_COMPLETE',hashlib.sha256(d).hexdigest())
          PY
  postgres-migration-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tower_ci_only
          POSTGRES_DB: tower_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tower_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: tower_ci_only
      PGDATABASE: tower_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate-v7-install-ready-20261016
      - name: V3 historic data and new gate constraint validation
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/tower_v3_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261014080000_tower_v3_free_prefab_sections.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261014130000_tower_v3_prefab_library_1752.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261015140000_tower_window_prefab_176.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261015221000_tower_door_prefab_176.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016135500_tower_wild_prefab_1753.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016181500_tower_gate_prefab_176.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/tower_v3_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/tower_v3_door_integration.sql
