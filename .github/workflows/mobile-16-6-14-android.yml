# Generator-backed launcher artwork; PNG files are reproduced before Expo prebuild.
name: Alan Til 16.6.14 Android

on:
  push:
    branches: [agent/16.6.14-roots-icon]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./mobile/app.json').expo.version")" = "16.6.14"
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = "39"
          test "$(node -p "require('./mobile/package.json').version")" = "16.6.14"
      - name: Generate launcher artwork
        run: node mobile/tools/generate-app-icons.mjs
      - name: 16.6.14 regression
        run: node --test tests/mobile-default-roots-icon-16-6-14.test.mjs mobile/tests/mobile-default-roots-icon-16-6-14.test.mjs
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Verify Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Package APK and source
        shell: bash
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk AlanTil-16.6.14.apk
          sha256sum AlanTil-16.6.14.apk > AlanTil-16.6.14.apk.sha256
          git archive --format=zip --output=AlanTil-16.6.14-source.zip HEAD
          zip -q -u AlanTil-16.6.14-source.zip mobile/assets/branding/alantil-icon.png mobile/assets/branding/alantil-adaptive-foreground.png
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.6.14-APK
          path: |
            AlanTil-16.6.14.apk
            AlanTil-16.6.14.apk.sha256
            AlanTil-16.6.14-source.zip
          if-no-files-found: error
