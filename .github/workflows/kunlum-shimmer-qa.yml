name: Kunlum stone shimmer A-B
on:
  push:
    branches: ['17.2']
    paths:
      - 'scripts/qa/browser-kunlum-shimmer.cjs'
      - '.github/workflows/kunlum-shimmer-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shimmer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/qa/browser-kunlum-shimmer.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: kunlum-shimmer-report
          path: kunlum-shimmer-results/
