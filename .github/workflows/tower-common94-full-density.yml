name: Measure all 25 Common94 wall sections against 0.90
on:
  push:
    branches: [agent/tower-common94-dense-20261017]
    paths:
      - '.github/workflows/tower-common94-full-density.yml'
permissions:
  contents: write
jobs:
  full-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tower-common94-dense-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==2.2.6' 'trimesh==4.11.1' 'scipy==1.15.3' 'rtree==1.4.1'
      - name: Bake all 25 candidates using only original 94 geometries
        run: |
          python tools/tower/bake-common94-candidates.py \
            --max-stones 1024 \
            --out assets/tower/prefabs/common94/candidate-full-17_7.json
      - name: Independently measure volume and block any unproven section
        run: |
          python tools/tower/verify-common94-density.py \
            --recipes assets/tower/prefabs/common94/candidate-full-17_7.json \
            --report assets/tower/prefabs/common94/candidate-full-density-17_7.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('assets/tower/prefabs/common94')
          r=json.loads((root/'candidate-full-density-17_7.json').read_text())
          assert r['tested']==25, r['tested']
          assert len({(x['section'],x['variant']) for x in r['rows']})==25
          print('ALL_25_MEASURED',r['passes'],'passed at minimum 0.90 real density')
          # The goal is a quality-gated preview; NEVER alter the active manifest here.
          if not r['approved']:print('RELEASE_BLOCKED_LOWER_THAN_90_PERCENT')
          PY
      - name: Preserve old 17.5.5 editor behavior
        run: node --test tests/compact-stones-1755.test.mjs
      - name: Commit candidate geometry recipes and independent rejection data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/prefabs/common94/candidate-full-17_7.json assets/tower/prefabs/common94/candidate-full-density-17_7.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(tower): publish 25 Common94 density candidates and independent QA'
          git push origin HEAD:agent/tower-common94-dense-20261017
