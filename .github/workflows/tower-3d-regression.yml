name: Tower 3D regression
on:
  push:
    branches: ["17.0"]
    paths:
      - "src/features/tower/**"
      - "packages/tower-game/**"
      - "assets/tower/processed-rocks.mjs"
      - "tests/tower-*.test.mjs"
      - "scripts/qa/browser-tower.cjs"
      - "supabase/migrations/*tower*.sql"
      - ".github/workflows/tower-3d-regression.yml"
  pull_request:
    branches: ["17.0"]
  workflow_dispatch:
jobs:
  tower-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check src/features/tower/scene.js
          node --check src/features/tower/index.js
          node --check packages/tower-game/masonry.mjs
          node --check packages/tower-game/masonry-geometry.mjs
          node --check packages/tower-game/masonry-packing.mjs
          node --check packages/tower-game/rock-shapes.mjs
          node --check packages/tower-game/rock-adaptation.mjs
          node --check packages/tower-game/masonry-authored-infill.mjs
          node --check packages/tower-game/masonry-core-mortar.mjs
          node --check packages/tower-game/masonry-contact.mjs
          node --check src/features/tower/masonry-worker.js
      - name: Chromium setup
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real WebGL interaction
        run: node scripts/qa/browser-tower.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-browser-evidence
          path: /tmp/alantil-tower-qa/*.png
          if-no-files-found: warn
      - name: Tower functional regression
        run: |
          node --test tests/tower-core.test.mjs tests/tower-processed-pack-17.test.mjs tests/tower-immersive-17.test.mjs tests/tower-masonry.test.mjs tests/tower-volume.test.mjs tests/tower-volume-real-rocks.test.mjs tests/tower-quality-17.test.mjs tests/tower-17-0-masonry-upgrade.test.mjs tests/tower-authored-infill-17.test.mjs tests/tower-contact-17.test.mjs
      - name: Stone-volume diagnostics for 2, 5, 15 and 50 rocks
        if: always()
        run: node scripts/qa/tower-masonry-metrics.mjs

  masonry-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Functional geometry and save compatibility
        run: |
          node --test tests/tower-core.test.mjs tests/tower-processed-pack-17.test.mjs tests/tower-immersive-17.test.mjs tests/tower-masonry.test.mjs tests/tower-volume.test.mjs tests/tower-volume-real-rocks.test.mjs tests/tower-quality-17.test.mjs tests/tower-17-0-masonry-upgrade.test.mjs tests/tower-authored-infill-17.test.mjs tests/tower-contact-17.test.mjs
      - name: Actual physical masonry QA
        if: always()
        run: node scripts/qa/tower-masonry-metrics.mjs

  source-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Archive every tracked source file
        run: |
          mkdir -p /tmp/tower-pr-source
          git archive --format=zip -o /tmp/tower-pr-source/AlanTil-17.0-PR60-full.zip HEAD
          git ls-files -z | xargs -0 -n1 stat -c '%n | %s bytes' > /tmp/tower-pr-source/FILE_SIZES_BYTES.txt
          unzip -t /tmp/tower-pr-source/AlanTil-17.0-PR60-full.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: tower-full-source-preview
          path: /tmp/tower-pr-source/*
          if-no-files-found: error
