name: AlanTil 17.0 complete source archive
# Fixed stone presets 17.0.9: archive full reviewed branch with restored authored 3D meshes.
on:
  push:
    branches: ["17.0"]
    paths:
      - ".github/workflows/tower-release-archive.yml"
  workflow_dispatch:
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build complete tracked source ZIP
        run: |
          git archive --format=zip --output=AlanTil-17.0-full.zip HEAD
          unzip -t AlanTil-17.0-full.zip | tail -n 1
          ls -lh AlanTil-17.0-full.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-17.0-complete-project
          path: AlanTil-17.0-full.zip
          retention-days: 14
