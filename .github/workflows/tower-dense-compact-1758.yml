name: Bake next compact wild stone recipes (candidate)
on:
  push:
    branches: ['17.2']
    paths:
      - 'tools/tower/bake-dense-compact-1758.py'
      - '.github/workflows/tower-dense-compact-1758.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install authored geometry baking libraries
        run: pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.11.1
      - name: Probe actual glb geometry and offline voxel packing on one section
        run: python tools/tower/bake-dense-compact-1758.py --kind 1x1x1 --variant 0 --verbose --out /tmp/alantil-dense-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alantil-dense-probe
          path: /tmp/alantil-dense-probe.json
          if-no-files-found: ignore
