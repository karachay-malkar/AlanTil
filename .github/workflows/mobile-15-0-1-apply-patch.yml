name: Apply AlanTil 15.0.1 patch

on:
  push:
    branches:
      - agent/15.0-unified-core
    paths:
      - '.github/workflows/mobile-15-0-1-apply-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/15.0-unified-core
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          cat .github/patches/15.0.1.part* | base64 -d > /tmp/15.patch
          git apply --check /tmp/15.patch
          git apply /tmp/15.patch

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile packages src tests
          git commit -m "15.0.1: UI parity and four-option tests"
          git push origin HEAD:agent/15.0-unified-core
