name: Visual QA 486 gate-stone section candidates
on:
  push:
    branches: ['17.2']
    paths:
      - 'assets/tower/prefabs/balkar71/placements-17_5_9.json'
      - 'assets/tower/prefabs/balkar71/placements-17_5_10.json'
      - 'assets/tower/prefabs/balkar71/placements-17_5_11.json'
      - 'tower-compact-review.html'
      - 'scripts/qa/browser-tower-gate-review-1759.cjs'
      - 'tests/tower-gate-instances-1759.test.mjs'
      - 'tests/tower-gate-faces-17510.test.mjs'
      - 'tests/tower-gate-faces-17511.test.mjs'
      - 'tools/tower/verify-gate-candidates-17511.py'
      - '.github/workflows/tower-gate-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 486 source transforms and keep old save versions
        run: node --test tests/tower-gate-instances-1759.test.mjs tests/tower-gate-faces-17510.test.mjs tests/tower-gate-faces-17511.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check real GLB stone vertices in every final transform
        run: |
          pip install numpy==2.3.5 trimesh==4.11.1
          python tools/tower/verify-gate-candidates-17511.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render all 75 gate-derived variants and mobile PNG/KTX2 evidence
        run: node scripts/qa/browser-tower-gate-review-1759.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alantil-486-stone-review-75-screenshots
          path: /tmp/alantil-gate-486-review/*.png
          if-no-files-found: warn
