name: Bake approved gate-stone masonry 17.5.4
on:
  push:
    branches: [agent/gate-stone-masonry-1754-20261016]
    paths:
      - .github/workflows/tower-gate-stones-1754.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    container:
      image: python:3.13-trixie
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate-stone-masonry-1754-20261016
      - name: Install geometric packer dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 trimesh==4.11.1 pillow==12.3.0
      - name: Unpack and verify full original readable source
        run: python tools/tower/restore-gate-stone-baker.py
      - name: Bake 25 section variants from exact v7 gate stones
        run: python tools/tower/bake-gate-stones-1754.py
      - name: Check 25 binaries and 486 individual natural rocks
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,trimesh,numpy as np
          folder=pathlib.Path('assets/tower/prefabs')
          data=json.loads((folder/'gate-stone-17_5_4-metrics.json').read_text())
          assert len(data['types'])==5
          assert len(list(folder.glob('gate-stone-section-*-17_5_4.glb')))==25
          assert data['sourceSha256']=='37dc0aee3bead89dba3ed5427af604c09340db0ede15ece139f9016fc920ba51'
          library=trimesh.load(folder/'gate-stones-library-v1-17_5_4.glb',force='scene')
          assert len(library.geometry)==486
          for kind,variants in data['types'].items():
              assert len(variants)==5,(kind,len(variants))
              hashes=set()
              for entry in variants:
                  p=pathlib.Path(entry['file'].lstrip('/')); assert p.is_file(),p
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==entry['sha256']
                  m=trimesh.load(p,force='scene')
                  assert len(m.geometry) in (1,2)
                  assert all(np.isfinite(g.vertices).all() for g in m.geometry.values())
                  assert entry['main']>=1 and entry['density']>=.4
                  hashes.add(entry['sha256'])
              assert len(hashes)==5
          print('GATE_MASONRY_25_VERIFIED')
          PY
      - name: Commit approved complete GLBs, library and readable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/tower/commit-gate-stone-glbs.py
