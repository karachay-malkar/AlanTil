name: Build AlanTil 14.1 Android APK

on:
  push:
    branches:
      - agent/14.1-mobile-foundation
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-14-1-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-14-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned dependencies
        working-directory: mobile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Persist dependency lockfile
        shell: bash
        run: |
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "14.1.1: lock mobile dependencies"
          git push origin HEAD:agent/14.1-mobile-foundation

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor@1.20.4

      - name: TypeScript check
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android native project
        working-directory: mobile
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android

      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        shell: bash
        run: |
          APK_PATH="$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" AlanTil-14.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-14.1.1-Android-APK
          path: AlanTil-14.1.1.apk
          if-no-files-found: error
          retention-days: 14
