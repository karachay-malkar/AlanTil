name: Build AlanTil 14.1 Android APK

on:
  push:
    branches:
      - agent/14.1-mobile-foundation
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-14-1-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Normalize Expo SDK 57 dependencies
        working-directory: mobile
        run: npx expo install --fix

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: TypeScript check
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android native project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk AlanTil-14.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-14.1-Android-APK
          path: AlanTil-14.1-debug.apk
          if-no-files-found: error
          retention-days: 14
