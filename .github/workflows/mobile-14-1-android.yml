# Final 14.1.6 validation
# Final build trigger after TypeScript integration fix.
name: Build AlanTil 14.1 Android APK

on:
  push:
    branches:
      - agent/14.1-mobile-foundation
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-14-1-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-14-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor@1.20.4

      - name: TypeScript check
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android native project
        working-directory: mobile
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android

      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        shell: bash
        run: |
          APK_PATH="$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" AlanTil-14.1.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-14.1.6-Android-APK
          path: AlanTil-14.1.6.apk
          if-no-files-found: error
          retention-days: 14
