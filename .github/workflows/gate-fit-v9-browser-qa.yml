name: Gate v9 interactive preview QA
on:
  push:
    branches: ['17.2']
    paths:
      - 'gate-fit-review.html'
      - 'gate-fit-review/gate-18x10x2-v9-candidate.glb'
      - 'gate-fit-review/candidate-v9-metrics.json'
      - 'scripts/qa/browser-gate-fit-v9.cjs'
      - '.github/workflows/gate-fit-v9-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test real GLB geometry and controls on desktop and mobile
        run: node scripts/qa/browser-gate-fit-v9.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-v9-real-webgl-review
          path: /tmp/alantil-gate-v9-preview/*.png
          if-no-files-found: warn
