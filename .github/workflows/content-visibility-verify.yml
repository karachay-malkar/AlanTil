name: Content visibility verification

on:
  pull_request:
    branches:
      - agent/16.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run content visibility regression tests
        run: node --test mobile/tests/content-visibility.test.mjs

      - name: Run feature full mobile/core suite
        shell: bash
        run: |
          set +e
          (cd mobile && npm test) > /tmp/feature-tests.log 2>&1
          echo $? > /tmp/feature-tests.exit
          set -e

      - name: Run baseline full mobile/core suite
        shell: bash
        run: |
          git checkout --detach origin/agent/16.8.0
          set +e
          (cd mobile && npm test) > /tmp/baseline-tests.log 2>&1
          echo $? > /tmp/baseline-tests.exit
          set -e
          git checkout --detach "$GITHUB_SHA"

      - name: Reject new test regressions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def failures(path):
              result = []
              for line in Path(path).read_text(errors="replace").splitlines():
                  match = re.match(r"not ok \d+ - (.+)", line)
                  if match:
                      result.append(match.group(1).strip())
              return set(result)

          feature = failures("/tmp/feature-tests.log")
          baseline = failures("/tmp/baseline-tests.log")
          added = sorted(feature - baseline)
          removed = sorted(baseline - feature)
          print(f"Baseline failing tests: {len(baseline)}")
          print(f"Feature failing tests: {len(feature)}")
          print(f"New failures: {len(added)}")
          if removed:
              print(f"Pre-existing failures fixed incidentally: {len(removed)}")
          if added:
              print("\n".join(f"NEW FAILURE: {name}" for name in added))
              raise SystemExit(1)
          PY

      - name: Build verified project archive
        run: |
          rm -f .github/workflows/content-visibility-verify.yml
          zip -qr /tmp/AlanTil-16.8.0-content-visibility.zip . -x ".git/*"

      - name: Upload verified project archive
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.8.0-content-visibility
          path: /tmp/AlanTil-16.8.0-content-visibility.zip
          if-no-files-found: error
          retention-days: 7
