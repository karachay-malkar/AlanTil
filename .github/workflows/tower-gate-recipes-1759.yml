name: Export 25 gate-quality 486-rock instance recipes (candidate)
on:
  push:
    branches: ['17.2']
    paths:
      - 'tools/tower/emit-gate-recipes-1759.py'
      - '.github/workflows/tower-gate-recipes-1759.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install approved-gate geometry libraries
        run: pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.11.1 pillow==12.3.0
      - name: Reconstruct and verify all 25 original 486-rock placements
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/emit-gate-recipes-1759.py
      - name: Validate identity and recipe constraints
        run: |
          python - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('assets/tower/prefabs/balkar71/placements-17_5_9.json').read_text())
          assert p['version']=='17.5.9'
          assert len(p['shapes'])==486
          assert len(p['variants'])==5 and all(len(x)==5 for x in p['variants'].values())
          for sections in p['variants'].values():
              for recipe in sections:
                  assert 1<=len(recipe['placement'])<=512
                  assert recipe['rocks']==len(recipe['placement'])
                  assert recipe['mainStoneCount']>0 and recipe['chinkingStoneCount']>0
                  assert 0<=recipe['minFaceCoverage']<=1
          print('GATE_CANDIDATES_VERIFIED_25')
          PY
      - name: Commit candidate ONLY; never overwrite live saved masonry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/prefabs/balkar71/placements-17_5_9.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(tower): prepare gate-derived 486-rock candidate recipes [skip prefab bake]'
            git pull --rebase origin 17.2
            git push origin HEAD:17.2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alantil-486-gate-recipes-25-candidate
          path: assets/tower/prefabs/balkar71/placements-17_5_9.json
          if-no-files-found: ignore
