name: AlanTil 17.2 — build compact route index

on:
  push:
    branches: ['17.2']
    paths:
      - 'src/data/dictionary-snapshot.json'
      - 'src/shared/domain/word-structure-compat.js'
      - 'packages/alantil-core/learning-route.js'
      - 'packages/alantil-core/alan-display.js'
      - 'scripts/assets/build-path-index.mjs'
      - '.github/workflows/17-2-path-route-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate identical route structure
        run: |
          node scripts/assets/build-path-index.mjs
          node -e "const x=require('./src/data/path-route-index.json'); if(!x.words.length||!x.version)process.exit(1);"
          test -s src/data/path-route-index.json.gz
      - name: Commit generated index
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/path-route-index.json src/data/path-route-index.json.gz
          if git diff --cached --quiet; then
            echo "The route index is unchanged."
            exit 0
          fi
          git commit -m "data(path): lightweight navigation index with dictionary parity"
          git push origin HEAD:17.2
