name: AlanTil 17.5 prepared stone sections and complete source
on:
  push:
    branches: ['17.2']
    paths:
      - 'assets/tower/prefabs/**'
      - 'assets/tower/source-original-36.glb'
      - 'packages/tower-game/**'
      - 'src/features/tower/**'
      - 'src/app/router.js'
      - 'src/shared/styles/lazy/tower.css'
      - 'tests/tower-*'
      - 'scripts/qa/browser-tower-prefab-17-4.cjs'
      - 'tools/tower/**'
      - '.github/workflows/tower-prefab-17-4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bake-prefabs:
    # Precomputed immutable assets; generated entirely offline from 36 authored meshes.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic offline geometry dependencies
        run: python3 -m pip install numpy scipy trimesh pillow
      - name: Rebuild all prepared natural-rock prefabs and joints
        run: OPENBLAS_NUM_THREADS=1 python3 tools/tower/build-prefab-library.py
      - name: Commit only generated GLB assets and their manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/prefabs
          if git diff --cached --quiet; then
            echo 'Prefabs already match offline compiler.'
          else
            git commit -m 'build(tower): bake dense authored-rock prefab library [skip prefab bake]'
            git push origin HEAD:17.2
          fi
  prefab-qa:
    needs: bake-prefabs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and all retained tower tests
        run: |
          node --check src/features/tower/index.js
          node --check src/features/tower/prefab-scene.js
          node --check packages/tower-game/prefab-layout.mjs
          node --check packages/tower-game/prefab-joints.mjs
          node --test tests/tower-*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify baked meshes against original authored source
        run: |
          python3 -m pip install numpy scipy trimesh pillow
          python3 - <<'PY'
          import pathlib, json, trimesh, hashlib
          root=pathlib.Path('assets/tower/prefabs')
          m=json.loads((root/'manifest.json').read_text())
          assert hashlib.sha256(pathlib.Path('assets/tower/source-original-36.glb').read_bytes()).hexdigest()==m['sourceSha256']
          assert m['version']=='17.5.0'
          assert len(m['types'])==5 and sum(len(t['variants']) for t in m['types'])==40
          for t in m['types']:
              for v in t['variants']:
                  q=v['quality']
                  assert q['mainRocks']>=1,(t['id'],v)
                  assert q['density']>=.61,(t['id'],v)
                  assert min(q['surfaceCoverage'])>=.44,(t['id'],v)
                  assert v['rocks']==q['mainRocks']+q['rubbleRocks']
          files=list(root.glob('*.glb')); assert len(files)==67
          for file in files:
              mesh=trimesh.load(file,force='mesh')
              mesh.merge_vertices(merge_tex=True,merge_norm=True,digits_vertex=5)
              assert mesh.is_watertight and len(mesh.faces)>0,(file,len(mesh.faces))
          for t in m['types']:
              for v in t['variants']:
                  f=pathlib.Path(v['file'].lstrip('/'))
                  m3d=trimesh.load(f,force='mesh')
                  assert m3d.visual.kind=='texture',(f,m3d.visual.kind)
                  mat=m3d.visual.material
                  assert isinstance(mat,trimesh.visual.material.PBRMaterial),f
                  assert mat.baseColorTexture is not None and mat.normalTexture is not None,f
          print('PREFAB_WATERTIGHT_AND_PBR_OK',len(files))
          PY
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real prefab editor WebGL and persistence
        run: node scripts/qa/browser-tower-prefab-17-4.cjs
      - name: Upload WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-17.5-prefab-browser
          path: /tmp/alantil-tower-prefab/*.png
          if-no-files-found: warn
  complete-source-archive:
    needs: bake-prefabs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - name: Archive and verify complete repository
        run: |
          git archive --format=zip -o AlanTil-17.5-complete-source.zip HEAD
          unzip -t AlanTil-17.5-complete-source.zip | tail -1
          git ls-files -z | xargs -0 -n1 stat -c '%n | %s bytes' > AlanTil-17.5-FILE_SIZES.txt
          ls -lh AlanTil-17.5-complete-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-17.5-complete-project
          path: |
            AlanTil-17.5-complete-source.zip
            AlanTil-17.5-FILE_SIZES.txt
          if-no-files-found: error