name: Capture AlanTil 15.0.2 TypeScript diagnostics

on:
  push:
    branches:
      - agent/15.0-unified-core
    paths:
      - '.github/workflows/mobile-15-0-2-typecheck-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/15.0-unified-core
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci
      - name: Capture typecheck
        working-directory: mobile
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck-errors.txt 2>&1
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/typecheck-errors.txt
          git commit -m "15.0.2: capture TypeScript diagnostics"
          git push
