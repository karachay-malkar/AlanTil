name: Package final AlanTil source
on:
  push:
    branches:
      - agent/16.8.0-trajectory-build
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d19757b72251ab50c765c09949162ff2c53103d
          fetch-depth: 0
      - name: Create source archive
        run: git archive --format=zip --output=AlanTil-16.8.0-3d19757.zip 3d19757b72251ab50c765c09949162ff2c53103d
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.8.0-3d19757
          path: AlanTil-16.8.0-3d19757.zip
          compression-level: 0
          if-no-files-found: error
