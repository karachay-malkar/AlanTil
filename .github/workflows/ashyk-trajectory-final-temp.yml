name: Ashyk trajectory final verification
on:
  push:
    branches:
      - agent/16.8.0-trajectory-build
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Ashyk build dependencies
        run: |
          npm install --prefix tools/ashyk-web --package-lock=false --no-audit --no-fund
          ln -s tools/ashyk-web/node_modules node_modules
      - run: node tools/ashyk-web/build.mjs
      - run: node scripts/qa/ashyk-trajectory-smoke.mjs
      - run: node --test tests/ashyk-shot-replication-16-7.test.mjs tests/ashyk-online-authority-16-7.test.mjs tests/social-ashyk-16-7-0.test.mjs tests/ashyk-wood-board-16-7-0.test.mjs mobile/tests/ashyk-ui-help-16-6-12.test.mjs tests/asset-versioning.test.mjs tests/release-version-16-7.test.mjs tests/web-style-cache-resilience-16-7-0.test.mjs
      - run: node scripts/qa/check-generated.mjs --ashyk
      - name: Protocol and cache invariants
        run: |
          ! grep -R --line-number --fixed-strings "16.8.0.1" index.html service-worker.js packages src scripts tests
          ! grep -E "shot-start|shot-frame|beginRemotePlayback|pushRemoteFrame|REMOTE_EXTRAPOLATE_MS|REMOTE_BUFFER_MS" packages/ashyk-game/engine.js packages/ashyk-game/session.js packages/ashyk-game/online.js src/features/ashyk/runtime.js
          grep -q "shot-trajectory" src/features/ashyk/runtime.js
          grep -q "playRemoteTrajectory" src/features/ashyk/runtime.js
