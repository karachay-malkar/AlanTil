name: Generate permanent 13.13 delivery manifest

on:
  push:
    branches:
      - "13.13"

jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "13.13"
      - name: Generate self-consistent manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = '.github/workflows/final-manifest-13-13.yml'
          manifest = 'FILE_SIZES_13.13.txt'
          rows=[]
          base_total=0
          for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts:
                  continue
              rel=p.as_posix().removeprefix('./')
              if rel in {workflow, manifest}:
                  continue
              size=p.stat().st_size
              base_total += size
              rows.append((rel,size))

          def render(self_size):
              total = base_total + self_size
              out = [
                  f'FILES\t{len(rows)+1}',
                  f'TOTAL_BYTES\t{total}',
                  f'TOTAL_KB\t{total/1024:.2f}',
              ]
              out.extend(f'{rel}\t{size}\t{size/1024:.2f} KB' for rel,size in rows)
              out.append(f'{manifest}\t{self_size}\t{self_size/1024:.2f} KB')
              return '\n'.join(out) + '\n'

          self_size=0
          for _ in range(20):
              content=render(self_size)
              new_size=len(content.encode('utf-8'))
              if new_size == self_size:
                  break
              self_size=new_size
          content=render(self_size)
          Path(manifest).write_text(content,encoding='utf-8')
          assert Path(manifest).stat().st_size == self_size
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_SIZES_13.13.txt
          git commit -m 'chore: add permanent 13.13 delivery manifest'
          git push origin HEAD:13.13
