name: Build and review Common100 masonry (staging only)
on:
  push:
    branches: ['17.2']
    paths:
      - 'tools/tower/bake-common100-masonry-review.py'
      - 'tools/tower/audit-common100-masonry-review.py'
      - '.github/workflows/tower-common100-masonry-staging.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: common100-masonry-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated offline modeling tooling
        run: pip install 'numpy==2.2.6' 'trimesh==4.11.1' 'shapely>=2,<3' scipy networkx
      - name: Generate all 25 ordinary stone recipes and 7 architectural / joint samples
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/bake-common100-masonry-review.py
      - name: Independent audit of staged geometry, fit, and unchanged production integration
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/audit-common100-masonry-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-common100-masonry-staging-32-cases
          path: assets/tower/prefabs/common100/masonry-review-v1.json
          if-no-files-found: error
      - name: Publish staging JSON (not manifest, not production)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/prefabs/common100/masonry-review-v1.json
          if git diff --cached --quiet; then
            echo STAGING_PREVIEW_UNCHANGED
          else
            git commit -m 'assets(tower): publish isolated Common100 masonry review [skip ci]'
            git pull --rebase origin 17.2
            git push origin HEAD:17.2
          fi
