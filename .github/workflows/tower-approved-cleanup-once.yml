name: One-time tower cleanup — branch 17.2
on:
  push:
    branches: ['17.2']
    paths:
      - '.github/workflows/tower-approved-cleanup-once.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: tower-172-one-time-clean
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert code parses before destructive cleanup
        run: |
          node --check scripts/maintenance/tower-17-2-cleanup.cjs
          node --check src/features/tower/prefab-scene.js
          node --check src/features/tower/index.js
          node --check src/features/tower/repository.js
          node --check packages/tower-game/prefab-joints.mjs
          node --check packages/tower-game/prefab-layout.mjs
          node --test scripts/qa/approved-library.test.mjs tests/tower-approved-manual.test.mjs
      - name: Remove obsolete towers and duplicated asset libraries
        run: node scripts/maintenance/tower-17-2-cleanup.cjs
      - name: Verify full approved-only tree, tests and checksum integrity
        run: |
          test ! -d assets/tower/prefabs
          test ! -d assets/tower/sections
          node --test scripts/qa/approved-library.test.mjs tests/tower-approved-manual.test.mjs scripts/qa/manual-masonry.test.mjs
      - name: Commit verified cleanup to branch
        run: |
          git config user.name "AlanTil CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/maintenance/tower-17-2-cleanup.cjs
          rm .github/workflows/tower-approved-cleanup-once.yml
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "chore(17.2): remove obsolete tower code and GLBs; approved library only"
          git push origin HEAD:17.2
