name: Package AlanTil 13.15.11

on:
  push:
    branches:
      - 13.15.11

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact release archive
        run: git archive --format=zip --prefix=AlanTil-13.15.11/ --output=AlanTil_13.15.11.zip "$GITHUB_SHA"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-13.15.11-full-project
          path: AlanTil_13.15.11.zip
          if-no-files-found: error
          retention-days: 7