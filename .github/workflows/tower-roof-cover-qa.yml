name: Tower roof-cover 17.2 QA
on:
  push:
    branches: ['17.2']
    paths:
      - 'packages/tower-game/roof-cover.mjs'
      - 'src/features/tower/**'
      - 'supabase/migrations/*tower_roof*.sql'
      - 'supabase/migrations/*tower_polygon_roof*.sql'
      - 'tests/tower-roof-cover-17-2.test.mjs'
      - 'release.json'
      - 'scripts/release/sync-version.mjs'
      - '.github/workflows/tower-roof-cover-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse modules
        run: |
          node --check src/features/tower/index.js
          node --check src/features/tower/prefab-scene.js
          node --check src/features/tower/roof-cover-scene.js
          node --check src/features/tower/repository.js
          node --check packages/tower-game/roof-cover.mjs
      - name: Polygon and support tests
        run: node --test tests/tower-roof-cover-17-2.test.mjs
      - name: Consistent release versions
        run: node scripts/release/sync-version.mjs --check
