name: Patch 16.1 Test Match chrome session status

on:
  push:
    branches:
      - agent/16.1-mobile-web-parity
    paths:
      - '.github/workflows/patch-16-1-chrome-session-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact session status replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/screens/practice-games.js')
          s = p.read_text()
          old_test = '<Header title="Проверь знания" subtitle={`${state.index+1}/${state.items.length}`} onBack={leave}/>'
          new_test = '<Header title="Проверь знания" onBack={leave} sessionStatus={{counter:`${state.index+1}/${state.items.length}`,mode:state.mode===\'ru\'?\'РУС → АЛАН\':\'АЛАН → РУС\'}}}/>'
          old_match = '<Header title="Сопоставление" subtitle={`${state.solvedCount}/${state.total}`} onBack={leave}/>'
          new_match = '<Header title="Сопоставление" onBack={leave} sessionStatus={{counter:`${state.solvedCount}/${state.total}`}}/>'
          assert s.count(old_test) == 1, f'test header occurrence mismatch: {s.count(old_test)}'
          assert s.count(old_match) == 1, f'match header occurrence mismatch: {s.count(old_match)}'
          s = s.replace(old_test, new_test).replace(old_match, new_match)
          p.write_text(s)
          PY
          rm .github/workflows/patch-16-1-chrome-session-status.yml
          git config user.name 'taulu'
          git config user.email 'taulantau5@gmail.com'
          git add mobile/screens/practice-games.js .github/workflows/patch-16-1-chrome-session-status.yml
          git commit -m '16.1: move Test and Match counters into web session status'
          git push origin HEAD:agent/16.1-mobile-web-parity
