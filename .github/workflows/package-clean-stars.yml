name: Package verified clean-star Path build

on:
  push:
    branches:
      - agent/package-16.8.0-clean-stars-20261002

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47e6470fa941445c4da57f99fd7cc84a36268efd
          fetch-depth: 0
      - name: Confirm verified source
        run: test "$(git rev-parse HEAD)" = "47e6470fa941445c4da57f99fd7cc84a36268efd"
      - name: Create full project archive
        run: git archive --format=zip --output=AlanTil-16.8.0-clean-stars.zip HEAD
      - name: Upload full project archive
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.8.0-clean-stars
          path: AlanTil-16.8.0-clean-stars.zip
          if-no-files-found: error
          retention-days: 1
