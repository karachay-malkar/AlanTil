name: Package final AlanTil 16.8.0
on:
  push:
    branches:
      - agent/16.8.0-final-package
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb6e6cf38fc336b67295418c103253a5af7dc1a0
          fetch-depth: 0
      - name: Create source archive
        run: git archive --format=zip --output=AlanTil-16.8.0-fb6e6cf.zip fb6e6cf38fc336b67295418c103253a5af7dc1a0
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.8.0-fb6e6cf
          path: AlanTil-16.8.0-fb6e6cf.zip
          compression-level: 0
          if-no-files-found: error
