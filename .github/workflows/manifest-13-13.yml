name: Generate 13.13 delivery manifest

on:
  push:
    branches:
      - "13.13"

jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "13.13"
      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          excluded = {
              '.github/workflows/manifest-13-13.yml',
          }
          font_ext = {'.ttf', '.otf', '.woff', '.woff2'}
          rows=[]
          total=0
          for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts:
                  continue
              rel=p.as_posix().removeprefix('./')
              if rel in excluded or p.suffix.lower() in font_ext:
                  continue
              size=p.stat().st_size
              total += size
              rows.append(f'{rel}\t{size}\t{size/1024:.2f} KB')
          out=Path('FILE_SIZES_13.13.txt')
          out.write_text(f'FILES\t{len(rows)}\nTOTAL_BYTES\t{total}\nTOTAL_KB\t{total/1024:.2f}\n'+'\n'.join(rows)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_SIZES_13.13.txt
          git commit -m 'chore: generated 13.13 file size manifest'
          git push origin HEAD:13.13
