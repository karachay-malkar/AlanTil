name: AlanTil 16.6.6 Bootstrap Staging

on:
  push:
    branches: [agent/16.6.6-bootstrap]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct verified 16.6.6 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp1666/chunk* > "$RUNNER_TEMP/1666.b64"
          echo "e017593e8a84875adae8d032aa31837a3a6cf6cd5850064debb8721648974529  $RUNNER_TEMP/1666.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/1666.b64" > "$RUNNER_TEMP/1666.tar.gz"
          echo "c6ddec8d2d95580690bfcc71259176e79080dea23b0bfe5596e39fe66a188151  $RUNNER_TEMP/1666.tar.gz" | sha256sum -c -
          git reset --hard edb52f0703a1f6da0f8093cae428a557aced55c3
          tar -xzf "$RUNNER_TEMP/1666.tar.gz"
          git diff --check
      - name: Verify shared and structural visual contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-shared-visual-css.mjs
          node scripts/check-shared-visual-contract-16-6-5.mjs
          node scripts/check-structural-visual-parity-16-6-6.mjs
          node scripts/check-full-screen-parity-16-6-3.mjs
          node scripts/check-parity-correction-16-6-1.mjs
      - name: Shared core regression tests
        run: node --test tests/alantil-core-16.test.mjs tests/progress-sync-policy.test.mjs tests/unified-core-boundary-16.test.mjs
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Mobile executable tests
        working-directory: mobile
        run: npm test
      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: Expo Web export smoke test
        working-directory: mobile
        run: npm run export:web
      - name: Create clean staging commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/node_modules mobile/dist-web mobile/package-lock.json
          git clean -fdX
          node scripts/generate-shared-visual-css.mjs
          git diff --exit-code -- src/shared/styles/shared-visual-tokens.css
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Complete 16.6.6 structural visual parity correction"
          staging_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "edb52f0703a1f6da0f8093cae428a557aced55c3"
          git push --force origin "HEAD:refs/heads/agent/16.6.6-staging"
          echo "STAGING_SHA=$staging_sha" >> "$GITHUB_ENV"
          echo "Staging SHA: $staging_sha" >> "$GITHUB_STEP_SUMMARY"
