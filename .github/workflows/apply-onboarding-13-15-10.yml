name: Apply onboarding refinement

on:
  push:
    branches:
      - 13.15.10
    paths:
      - .github/workflows/apply-onboarding-13-15-10.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: 13.15.10
          fetch-depth: 0

      - name: Apply exact source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/onboarding-patch/part-* > /tmp/onboarding-patch.b64
          base64 -d /tmp/onboarding-patch.b64 > /tmp/onboarding-patch.tar.xz
          tar -xJf /tmp/onboarding-patch.tar.xz -C .
          rm -rf .github/onboarding-patch

          node --check src/features/onboarding/guide.js
          node --check src/features/onboarding/index.js
          node --check src/app/bootstrap.js
          node --check service-worker.js

          grep -Fq 'fill:rgba(25,25,25,.54)' src/features/onboarding/guide.js
          ! grep -Fq 'organicPanelPath' src/features/onboarding/guide.js
          grep -Fq 'Это базовая лексика для начинающих.' src/features/onboarding/guide.js
          grep -Fq 'viewportHeight * .28' src/features/onboarding/guide.js
          grep -Fq 'viewportHeight * .40' src/features/onboarding/guide.js
          grep -Fq 'viewportHeight * .65' src/features/onboarding/guide.js
          grep -Fq 'minSpotlightWidth: 90' src/features/onboarding/guide.js
          grep -Fq 'transitionend' src/features/onboarding/guide.js
          grep -Fq 'padding:10px 8px 4px' src/features/path/path.css
          grep -Fq 'padding-left:6px;padding-right:6px' src/features/path/path.css
          grep -Fq 'guide.js?v=13.15.10.9' src/features/onboarding/index.js
          grep -Fq 'RELEASE_VERSION = "13.15.10.9"' src/app/bootstrap.js
          grep -Fq 'const VERSION = "13.15.10.9"' service-worker.js
          grep -Fq 'const targetVersion = "13.15.10.9"' index.html

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "13.15.10: refine guided onboarding"
          git push origin HEAD:13.15.10
