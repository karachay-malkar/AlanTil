name: Ashyk runtime part 1

on:
  push:
    branches:
      - agent/16.8.0

permissions:
  contents: write

jobs:
  rebuild-runtime:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'ci: rebuild Ashyk runtime part 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/16.8.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source and build process
        run: |
          test -s packages/ashyk-game/web/Game.jsx
          test -s tools/ashyk-web/build.mjs
          ! grep -F ':null:null' packages/ashyk-game/web/Game.jsx
      - name: Rebuild runtime from Game.jsx
        run: node tools/ashyk-web/build.mjs
      - name: Verify generated runtime
        run: |
          test -s src/features/ashyk/runtime.js
          node --check src/features/ashyk/runtime.js
          ! grep -F ':null:null' src/features/ashyk/runtime.js
          node --input-type=module -e "import('./src/features/ashyk/runtime.js').then((m)=>{if(typeof m.mountAshykGame!=='function')throw new Error('mountAshykGame export missing')})"
          wc -c src/features/ashyk/runtime.js
      - name: Commit and push runtime
        run: |
          rm .github/workflows/__ashyk-runtime-part1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ashyk/runtime.js .github/workflows/__ashyk-runtime-part1.yml
          git diff --cached --check
          test -s src/features/ashyk/runtime.js
          git commit -m "fix: rebuild Ashyk web runtime"
          git push origin HEAD:agent/16.8.0
