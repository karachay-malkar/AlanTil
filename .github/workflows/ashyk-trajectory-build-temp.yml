name: Ashyk trajectory build verification
on:
  push:
    branches: [agent/16.8.0-trajectory-build]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --prefix tools/ashyk-web --package-lock=false --no-audit --no-fund
      - run: node tools/ashyk-web/build.mjs
      - run: node --test tests/ashyk-shot-replication-16-7.test.mjs tests/ashyk-online-authority-16-7.test.mjs tests/social-ashyk-16-7-0.test.mjs
      - run: node scripts/qa/check-generated.mjs --ashyk
      - name: Commit generated runtime on temporary branch
        run: |
          git config user.name "AlanTil Build"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/ashyk/runtime.js
          git diff --cached --quiet || git commit -m "temp: generate Ashyk trajectory runtime"
          git push
