name: AlanTil 16.6.3 Expo Web Pages

on:
  push:
    branches: [agent/16.6.3-full-screen-parity]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alantil-expo-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure Expo Pages base path
        working-directory: mobile
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'app.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.expo.experiments = { ...(config.expo.experiments || {}), baseUrl: process.env.PAGES_BASE_PATH || '/AlanTil' };
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          console.log('Expo baseUrl:', config.expo.experiments.baseUrl);
          NODE

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Mobile executable tests
        working-directory: mobile
        run: npm test

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Export Expo Web for Pages
        working-directory: mobile
        run: npm run export:web

      - name: Validate Pages export contract
        working-directory: mobile
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const base = process.env.PAGES_BASE_PATH || '/AlanTil';
          const root = 'dist-web';
          const index = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          if (!index.includes(`src="${base}/_expo/`)) throw new Error(`index.html is not using Pages base path ${base}`);
          for (const file of fs.readdirSync(path.join(root, '_expo/static/js/web')).filter(name => name.endsWith('.js'))) {
            const text = fs.readFileSync(path.join(root, '_expo/static/js/web', file), 'utf8');
            if (text.includes('"/assets/') || text.includes("'/assets/") || text.includes('"/_expo/') || text.includes("'/_expo/")) {
              throw new Error(`${file}: unresolved root-relative Expo path`);
            }
          }
          fs.writeFileSync(path.join(root, '.nojekyll'), '');
          console.log('GitHub Pages Expo Web contract: PASS', base);
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
