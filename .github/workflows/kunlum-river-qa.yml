name: Kunlum verified river geometry QA
on:
  push:
    branches: ['17.2']
    paths:
      - 'src/features/tower/kunlum-osm-river.js'
      - 'src/features/tower/kunlum-river-layer.js'
      - 'src/features/tower/kunlum-terrain-scatter.js'
      - 'src/features/tower/kunlum-real-environment.js'
      - 'src/features/tower/kunlum-terrain-lod.js'
      - 'src/features/tower/kunlum-build-alignment.js'
      - 'src/features/tower/kunlum-wide-dem.js'
      - 'tests/kunlum-aligned-wide-world.test.mjs'
      - 'src/features/tower/prefab-scene.js'
      - 'src/features/tower/index.js'
      - 'src/app/bootstrap.js'
      - 'src/app/router.js'
      - 'src/shared/styles/lazy/tower.css'
      - 'service-worker.js'
      - 'release.json'
      - 'index.html'
      - 'tests/tower-release-cache-17-2.test.mjs'
      - 'src/features/tower/tower.css'
      - 'tests/kunlum-real-terrain.test.mjs'
      - 'tests/fixtures/kunlum-tower-world.html'
      - 'scripts/qa/browser-tower-kunlum-world.cjs'
      - 'assets/tower/environment/kunlum-cherek-balkarsky-osm.json'
      - 'kunlum-terrain-review.html'
      - 'kunlum-vector-editor.html'
      - 'kunlum-terrace-editor-3d.html'
      - 'scripts/qa/browser-kunlum-editors.cjs'
      - 'tests/kunlum-river-realism.test.mjs'
      - 'tests/kunlum-tower-world-17-2.test.mjs'
      - 'scripts/qa/browser-kunlum-river.cjs'
      - '.github/workflows/kunlum-river-qa.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Cherek geometry and snapshot validation
        run: node --experimental-default-type=module --test tests/kunlum-river-realism.test.mjs tests/kunlum-tower-world-17-2.test.mjs tests/kunlum-real-terrain.test.mjs tests/kunlum-aligned-wide-world.test.mjs tests/tower-release-cache-17-2.test.mjs
      - name: Module and embedded viewer syntax
        run: |
          node --check src/features/tower/kunlum-osm-river.js
          node --check src/features/tower/kunlum-river-layer.js
          node --check src/features/tower/kunlum-terrain-scatter.js
          node --check src/features/tower/kunlum-terrain-lod.js
          node --check src/features/tower/kunlum-build-alignment.js
          node --check src/features/tower/kunlum-wide-dem.js
          node --check src/features/tower/kunlum-real-environment.js
          node --check src/features/tower/prefab-scene.js
          node --check src/features/tower/index.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('kunlum-terrain-review.html').read_text()
          code=re.search(r'<script type="module">([\s\S]*?)</script>',s)
          assert code, 'Missing terrain preview module'
          Path('/tmp/kunlum-preview.mjs').write_text(code.group(1))
          PY
          node --check /tmp/kunlum-preview.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Serve exact branch and open WebGL on desktop and mobile
        run: |
          node scripts/static-preview-server.mjs > /tmp/kunlum-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:4173/kunlum-terrain-review.html -o /dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome)"
          node scripts/qa/browser-kunlum-river.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kunlum-cherek-desktop-mobile
          path: river-browser-qa/
          retention-days: 14
          if-no-files-found: warn

  tower-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Verify real tower construction and mapped 3D world in desktop and mobile
        run: |
          node scripts/static-preview-server.mjs > /tmp/tower-world-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:4173/tests/fixtures/kunlum-tower-world.html -o /dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome)"
          node scripts/qa/browser-tower-kunlum-world.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-kunlum-world-desktop-mobile
          path: tower-world-browser-qa/
          retention-days: 14
          if-no-files-found: warn

  editor-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Verify one source plan in 2D and 3D editors (desktop/mobile)
        run: |
          node scripts/static-preview-server.mjs > /tmp/kunlum-editor-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:4173/kunlum-vector-editor.html -o /dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome)"
          node scripts/qa/browser-kunlum-editors.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kunlum-unified-editors-desktop-mobile
          path: kunlum-editors-browser-qa/
          retention-days: 14
          if-no-files-found: warn
