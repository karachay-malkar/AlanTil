name: Kunlum verified river geometry QA
on:
  push:
    branches: ['17.2']
    paths:
      - 'src/features/tower/kunlum-osm-river.js'
      - 'src/features/tower/kunlum-river-layer.js'
      - 'src/features/tower/kunlum-terrain-scatter.js'
      - 'assets/tower/environment/kunlum-cherek-balkarsky-osm.json'
      - 'kunlum-terrain-review.html'
      - 'tests/kunlum-river-realism.test.mjs'
      - '.github/workflows/kunlum-river-qa.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Cherek geometry and snapshot validation
        run: node --experimental-default-type=module --test tests/kunlum-river-realism.test.mjs
      - name: Module syntax
        run: |
          node --check src/features/tower/kunlum-osm-river.js
          node --check src/features/tower/kunlum-river-layer.js
          node --check src/features/tower/kunlum-terrain-scatter.js
