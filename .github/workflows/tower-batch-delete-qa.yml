name: Tower 17.2 — atomic batch delete QA
on:
  push:
    branches: ['17.2']
    paths:
      - 'src/features/tower/index.js'
      - 'src/features/tower/prefab-scene.js'
      - 'src/features/tower/repository.js'
      - 'src/features/tower/batch-delete-selection.mjs'
      - 'src/features/tower/tower.css'
      - 'supabase/migrations/*tower_v3_batch_remove*'
      - 'tests/tower-batch-delete-selection.test.mjs'
      - 'tests/fixtures/tower-batch-delete.html'
      - 'scripts/qa/browser-tower-batch-delete.cjs'
      - 'release.json'
      - '.github/workflows/tower-batch-delete-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and selection regression
        run: |
          node --check src/features/tower/index.js
          node --check src/features/tower/prefab-scene.js
          node --check src/features/tower/repository.js
          node --check src/features/tower/batch-delete-selection.mjs
          node --test tests/tower-batch-delete-selection.test.mjs tests/tower-hud.test.mjs tests/tower-render-cache.test.mjs tests/tower-approved-manual.test.mjs
          node scripts/release/sync-version.mjs --check
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify mobile selection, confirmation, floating survivors and refund
        run: node scripts/qa/browser-tower-batch-delete.cjs
