name: Apply AlanTil 14.1.3 Visual Parity

on:
  push:
    branches:
      - agent/14.1-mobile-foundation
    paths:
      - '.github/workflows/mobile-14-1-visual-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual parity source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/mobile-14-1-visual-sync.yml').read_text()
          body = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(body), {})
          PY
      - name: Commit mobile visual parity
        shell: bash
        run: |
          git config user.name taulu
          git config user.email taulantau5@gmail.com
          git add mobile
          git diff --cached --quiet && exit 0
          git commit -m "14.1.3: align shell and path visuals"
          git push origin HEAD:${GITHUB_REF_NAME}
