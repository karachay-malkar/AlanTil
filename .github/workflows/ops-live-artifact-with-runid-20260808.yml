name: Ops Live Artifact With Run ID 20260808

on:
  push:
    branches:
      - ops/word-sync-2026-08-08
    paths:
      - .github/workflows/ops-live-artifact-with-runid-20260808.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/word-sync-2026-08-08
      - name: Export current live view
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -y >/dev/null && sudo apt-get install -y postgresql-client >/dev/null; fi
          export PGCONNECT_TIMEOUT=20
          mkdir -p /tmp/alantil_live_export
          psql "$SUPABASE_DB_URL" -X -q -Atc "select coalesce(json_agg(v order by global_order,word_id),'[]'::json) from public.v_words_app v" > /tmp/alantil_live_export/live_v_words_app.json
          python - <<'PY'
          import gzip,hashlib,json,pathlib
          p=pathlib.Path('/tmp/alantil_live_export/live_v_words_app.json')
          rows=json.loads(p.read_text(encoding='utf-8'))
          if len(rows)!=2355: raise SystemExit(f'Expected 2355 rows, got {len(rows)}')
          raw=json.dumps(rows,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          pathlib.Path('/tmp/alantil_live_export/live_v_words_app.json.gz').write_bytes(gzip.compress(raw,compresslevel=9))
          pathlib.Path('/tmp/alantil_live_export/manifest.json').write_text(json.dumps({'rows':len(rows),'raw_sha256':hashlib.sha256(raw).hexdigest()},indent=2),encoding='utf-8')
          p.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alantil-live-v-words-final-20260808
          path: /tmp/alantil_live_export/
          if-no-files-found: error
          retention-days: 1
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops_word_sync_dburl_20260808/artifact_run
          printf '{"run_id": %s, "commit_sha": "%s", "artifact_name": "alantil-live-v-words-final-20260808"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > ops_word_sync_dburl_20260808/artifact_run/run_meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops_word_sync_dburl_20260808/artifact_run/run_meta.json
          git commit -m "ops: record final live export artifact run"
          git push origin HEAD:ops/word-sync-2026-08-08
