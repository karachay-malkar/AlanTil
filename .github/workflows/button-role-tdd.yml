name: Button role verification

on:
  push:
    branches:
      - agent/button-role-16.8.0-20261004

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild and persist Ashyk runtime
        run: |
          node tools/ashyk-web/build.mjs
          git add src/features/ashyk/runtime.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: rebuild Ashyk runtime for Button contract"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Verify generated visual contracts
        run: |
          node scripts/generate-shared-visual-css.mjs
          node scripts/sync-mobile-parity-16-7.mjs
          node scripts/sync-visual-contract-16-7.mjs --check
          git diff --exit-code
      - name: Verify typography and asset identity
        run: node --test tests/typography-13-15-12.test.mjs tests/asset-versioning.test.mjs
      - name: Verify current Web visual parity
        run: node --test tests/visual-parity-16-7-0.test.mjs
      - name: Verify architecture and current Mobile regressions
        run: node --test tests/unified-core-boundary-16.test.mjs mobile/tests/architecture.test.mjs mobile/tests/practice-mechanics-parity-16-6-7.test.mjs mobile/tests/mobile-polish-16-6-8.test.mjs
