name: Button role TDD

on:
  push:
    branches:
      - agent/button-role-16.8.0-20261004

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/typography-13-15-12.test.mjs
