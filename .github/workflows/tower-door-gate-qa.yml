name: Door grounding and gate preparation QA
on:
  push:
    branches: [agent/door-ground-gate-v7-20261016]
    paths: [.github/workflows/tower-door-gate-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/door-ground-gate-v7-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Door geometry and all tower regression tests
        run: |
          node --check src/features/tower/index.js
          node --check src/features/tower/prefab-scene.js
          node --test tests/door-prefab.test.mjs tests/window-prefab.test.mjs tests/tower-*.test.mjs
