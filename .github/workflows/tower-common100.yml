name: Build and verify gate-derived common-100 3D stones
on:
  push:
    branches: ['17.2']
    paths:
      - 'tools/tower/build-common100.py'
      - 'tools/tower/audit-common100-quality.py'
      - '.github/workflows/tower-common100.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake-common100:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline model tooling
        run: pip install 'numpy==2.2.6' 'trimesh==4.11.1' scipy pillow networkx
      - name: Reproduce existing pointed-end defect (expected red)
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/audit-common100-quality.py
      - name: Extract approved gate stones, select and build 100 distinct meshes
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/build-common100.py
      - name: Independent output audit and full source immutability
        run: |
          python - <<'PY'
          import json,pathlib,trimesh,hashlib
          r=pathlib.Path('assets/tower/prefabs/common100')
          j=json.loads((r/'common-100.json').read_text())
          b=(r/'common-100.glb').read_bytes()
          assert len(j['models'])==100
          assert j['count']==100
          assert j['counts']=={'main':72,'large':10,'chinking':12,'lintel':6}
          assert sum(j['originCounts'].values())==100
          assert j['glbSHA256']==hashlib.sha256(b).hexdigest()
          assert j['sourceGateSHA256']==hashlib.sha256(pathlib.Path(j['sourceGate']).read_bytes()).hexdigest()
          s=trimesh.load(r/'common-100.glb',force='scene',process=False)
          assert len(s.geometry)==100
          assert all(m.is_watertight and m.visual.uv is not None for m in s.geometry.values())
          assert len({v['geometrySHA256'] for v in j['models']})==100
          assert j['originCounts'].get('gate',0)>=70, j['originCounts']
          print('COMMON100_FULL_QA_PASS',j['originCounts'])
          PY
      - name: Source 3D model regression
        run: |
          node --test tests/tower-gate-stones-1754.test.mjs tests/compact-stones-1755.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-common-100-GLB-and-JSON
          path: |
            assets/tower/prefabs/common100/common-100.glb
            assets/tower/prefabs/common100/common-100.json
          if-no-files-found: error
      - name: Commit generated checked 3D models to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/prefabs/common100/common-100.glb assets/tower/prefabs/common100/common-100.json
          if git diff --cached --quiet; then
            echo 'COMMON100_UNCHANGED'
          else
            git commit -m 'assets(tower): publish audited source-gate-first common100 library [skip ci]'
            git pull --rebase origin 17.2
            git push origin HEAD:17.2
          fi
