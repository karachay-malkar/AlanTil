name: Ashyk instructional video
on:
  push:
    branches: [agent/ashyk-rules-video-20260930]
    paths:
      - scripts/record-ashyk-rules-video.mjs
      - .github/workflows/ashyk-rules-video.yml
concurrency:
  group: ashyk-rules-video
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system recording tools
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get install -y -qq ffmpeg xvfb pulseaudio
      - name: Install JavaScript dependencies
        timeout-minutes: 3
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npm install --prefix tools/ashyk-web --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        timeout-minutes: 4
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: npx playwright install --with-deps --no-shell chromium
      - name: Start sound output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=recording sink_properties=device.description=Recording
          pactl set-default-sink recording
          pactl set-default-source recording.monitor
      - name: Record original game
        run: xvfb-run -a -s "-screen 0 1280x900x24" node scripts/record-ashyk-rules-video.mjs
      - name: Validate video and sound
        if: always()
        run: |
          if test -f video-output/ashyk-rules.mp4; then
            ffprobe -v error -show_format -show_streams -of json video-output/ashyk-rules.mp4 > video-output/media-info.json
            ffmpeg -i video-output/ashyk-rules.mp4 -af volumedetect -vn -sn -dn -f null - 2> video-output/audio-check.txt
          fi
          python3 -c 'import json,re,pathlib; p=pathlib.Path("video-output"); m=json.loads((p/"media-info.json").read_text()); a=(p/"audio-check.txt").read_text(); v=re.search(r"max_volume: ([\-0-9.]+) dB",a); print("MEDIA_VERIFIED",m["format"]["duration"],m["format"]["size"],v.group(1) if v else "missing"); assert v and float(v.group(1)) > -55; assert len(m["streams"]) == 2; assert (p/"verification.json").exists()'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashyk-rules-video
          path: |
            video-output/ashyk-rules.mp4
            video-output/preview.png
            video-output/source-parity.json
            video-output/verification.json
            video-output/media-info.json
            video-output/audio-check.txt
          retention-days: 30
