name: Apply AlanTil 14.1.3 Path Safe Area Fix

on:
  push:
    branches:
      - agent/14.1-mobile-foundation
    paths:
      - '.github/workflows/mobile-14-1-path-safe-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Path header safe areas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/src/mobile/path.tsx')
          s = p.read_text()
          changes = [
            ("<View style={[styles.pathHeader, { paddingTop: insets.top + 10 }] }>", "<View style={[styles.pathHeader, { paddingTop: insets.top + 10, height: 68 + insets.top }] }>") ,
            ("<View style={[styles.detailHeader, { paddingTop: insets.top + 8 }] }>", "<View style={[styles.detailHeader, { height: 42 + insets.top, paddingTop: insets.top }] }>") ,
          ]
          for old, new in changes:
              if old not in s:
                  raise SystemExit(f'Expected source not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit safe area fix
        shell: bash
        run: |
          git config user.name taulu
          git config user.email taulantau5@gmail.com
          git add mobile/src/mobile/path.tsx
          git commit -m "14.1.3: fix path header safe areas"
          git push origin HEAD:${GITHUB_REF_NAME}
