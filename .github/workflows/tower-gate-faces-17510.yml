name: Probe face-filled 486-rock wild masonry
on:
  push:
    branches: ['17.2']
    paths:
      - 'tools/tower/improve-gate-faces-17510.py'
      - '.github/workflows/tower-gate-faces-17510.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline geometry dependencies
        run: pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.11.1 pillow==12.3.0
      - name: Improve exterior faces on all 25 sections offline
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/improve-gate-faces-17510.py
      - name: Verify immutable original source and 25 different placements
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('assets/tower/prefabs/balkar71')
          candidate=json.loads((root/'placements-17_5_10.json').read_text())
          assert candidate['version']=='17.5.10'
          assert len(candidate['shapes'])==486
          assert len(candidate['variants'])==5
          records=[]
          for key,variants in candidate['variants'].items():
              assert len(variants)==5
              assert len(set(r['sha256'] for r in variants))==5
              for r in variants:
                  assert 1<=r['rocks']<=512
                  assert r['rocks']==len(r['placement'])
                  assert r['occupancy']>=r['beforeOccupancy']-1e-5
                  assert all(0<=f<=1 for f in r['faceCoverage'])
                  records.append(r)
          assert len(records)==25
          print('FACE_PACKED_25_VERIFIED')
          print('MIN_FACE_COVERAGE',min(r['minFaceCoverage'] for r in records))
          print('MEAN_FACE_COVERAGE',round(sum(r['minFaceCoverage'] for r in records)/25,4))
          print('MEAN_DENSITY',round(sum(r['occupancy'] for r in records)/25,4))
          print('OVER_90_PERCENT',sum(r['occupancy']>=.90 for r in records))
          PY
      - name: Publish candidate JSON only; keep installed towers unchanged
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/prefabs/balkar71/placements-17_5_10.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(tower): face-pack 25 unapproved 486-rock recipes [skip prefab bake]'
            git pull --rebase origin 17.2
            git push origin HEAD:17.2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alantil-gate-face-25-candidates
          path: assets/tower/prefabs/balkar71/placements-17_5_10.json
          if-no-files-found: ignore
