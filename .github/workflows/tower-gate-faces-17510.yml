name: Probe face-filled 486-rock wild masonry
on:
  push:
    branches: ['17.2']
    paths:
      - 'tools/tower/improve-gate-faces-17510.py'
      - '.github/workflows/tower-gate-faces-17510.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline geometry dependencies
        run: pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.11.1 pillow==12.3.0
      - name: Probe actual exterior-gap reduction in one medium section
        run: OPENBLAS_NUM_THREADS=1 python tools/tower/improve-gate-faces-17510.py --kind 2x2x2 --variant 0 --out /tmp/gate-face-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alantil-gate-face-probe
          path: /tmp/gate-face-probe.json
          if-no-files-found: ignore
