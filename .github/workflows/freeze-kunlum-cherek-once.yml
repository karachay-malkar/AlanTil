name: Freeze verified Cherek Balkarsky OSM centreline (once)
on:
  push:
    branches: ['17.2']
    paths: ['.github/workflows/freeze-kunlum-cherek-once.yml']
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '17.2'
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve named Cherek from public OSM map API
        run: |
          python3 <<'PY'
          import json,urllib.request,xml.etree.ElementTree as ET,time
          bbox='43.395,43.074,43.483,43.143'
          errors=[]
          for host in ['https://api.openstreetmap.org','https://www.openstreetmap.org']:
            try:
              req=urllib.request.Request(host+'/api/0.6/map?bbox='+bbox,headers={'User-Agent':'AlanTil-Kunlum-heritage-map/1.0 (ODbL snapshot)'})
              with urllib.request.urlopen(req,timeout=35) as response:
                raw=response.read(35000000)
              tree=ET.fromstring(raw)
              nodes={n.attrib['id']:(float(n.attrib['lon']),float(n.attrib['lat'])) for n in tree.findall('node')}
              ways=[]
              for way in tree.findall('way'):
                tags={tag.attrib['k']:tag.attrib['v'] for tag in way.findall('tag')}
                if tags.get('waterway')!='river':continue
                geometry=[{'lon':nodes[nd.attrib['ref']][0],'lat':nodes[nd.attrib['ref']][1]} for nd in way.findall('nd') if nd.attrib['ref'] in nodes]
                if len(geometry)>1: ways.append({'type':'way','tags':tags,'geometry':geometry})
              with open('/tmp/kunlum-osm-ways.json','w') as output:json.dump({'elements':ways},output)
              print('OSM main API: '+str(len(ways))+' river ways, '+str(len(nodes))+' nodes, '+str(len(raw))+' bytes')
              break
            except Exception as exc:
              errors.append(str(exc))
              time.sleep(3)
          else: raise Exception('OSM API unavailable: '+'; '.join(errors))
          PY
          node --experimental-default-type=module --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync,existsSync} from 'node:fs';
          import {createKunlumRiverProjection,extractKunlumCherekPolyline} from './src/features/tower/kunlum-osm-river.js';
          const path='assets/tower/environment/kunlum-cherek-balkarsky-osm.json';
          if(existsSync(path)){console.log('Snapshot already present');process.exit(0)}
          const osm=JSON.parse(readFileSync('/tmp/kunlum-osm-ways.json','utf8'));
          const line=extractKunlumCherekPolyline(osm,{project:createKunlumRiverProjection()})
           .map(({x,z})=>[Math.round(x*100)/100,Math.round(z*100)/100]);
          const length=line.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-line[i][0],p[1]-line[i][1]),0);
          const gaps=line.slice(1).map((p,i)=>Math.hypot(p[0]-line[i][0],p[1]-line[i][1]));
          if(line.length<12||length<800||gaps.some(d=>d>200)||!line.some(([x,z])=>Math.abs(x)<2000&&Math.abs(z)<1800))
            throw Error('OSM Cherek validation rejected: '+line.length+' points, '+length+' metres, max gap '+Math.max(...gaps));
          mkdirSync('assets/tower/environment',{recursive:true});
          writeFileSync(path,JSON.stringify({
            schema:1,name:'Черек Балкарский',projection:'UTM38 local metres relative to tower control',
            origin:{easting:372151.107,northing:4773796.751},
            source:'OpenStreetMap map API /api/0.6/map (named waterways)',license:'ODbL',
            acquiredAt:new Date().toISOString(),points:line
          },null,2)+'\n');
          console.log('Frozen OSM line: '+line.length+' vertices, '+Math.round(length)+' m, max gap '+Math.round(Math.max(...gaps))+' m');
          NODE
      - name: Commit immutable snapshot to 17.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tower/environment/kunlum-cherek-balkarsky-osm.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(kunlum): freeze confirmed OSM Cherek Balkarsky centreline'
          git push origin HEAD:17.2
