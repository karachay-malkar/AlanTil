name: Temp Supabase deploy capability probe
on:
  push:
    branches:
      - agent/16.8.0-visibility-audit-temp
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credential presence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ALANTIL_SUPABASE_ACCESS_TOKEN: ${{ secrets.ALANTIL_SUPABASE_ACCESS_TOKEN }}
          ALANTIL_SUPABASE_DB_PASSWORD: ${{ secrets.ALANTIL_SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" && echo "SUPABASE_ACCESS_TOKEN_PRESENT=true" || echo "SUPABASE_ACCESS_TOKEN_PRESENT=false"
          test -n "$SUPABASE_DB_PASSWORD" && echo "SUPABASE_DB_PASSWORD_PRESENT=true" || echo "SUPABASE_DB_PASSWORD_PRESENT=false"
          test -n "$ALANTIL_SUPABASE_ACCESS_TOKEN" && echo "ALANTIL_SUPABASE_ACCESS_TOKEN_PRESENT=true" || echo "ALANTIL_SUPABASE_ACCESS_TOKEN_PRESENT=false"
          test -n "$ALANTIL_SUPABASE_DB_PASSWORD" && echo "ALANTIL_SUPABASE_DB_PASSWORD_PRESENT=true" || echo "ALANTIL_SUPABASE_DB_PASSWORD_PRESENT=false"
