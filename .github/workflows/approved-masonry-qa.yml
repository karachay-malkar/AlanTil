name: Tower 17.2 — current approved masonry only
on:
  push:
    branches: ['17.2']
    paths:
      - 'assets/tower/**'
      - 'packages/tower-game/**'
      - 'src/features/tower/**'
      - 'src/features/masonry/**'
      - 'tests/tower-approved-manual.test.mjs'
      - 'scripts/qa/approved-library.test.mjs'
      - '.github/workflows/approved-masonry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of the complete runtime modules
        run: |
          node --check packages/tower-game/approved-prefab.mjs
          node --check packages/tower-game/prefab-layout.mjs
          node --check packages/tower-game/prefab-joints.mjs
          node --check src/features/tower/approved-section-scene.js
          node --check src/features/tower/prefab-scene.js
          node --check src/features/tower/index.js
          node --check src/features/tower/repository.js
          node --check src/features/masonry/architecture-assets.js
          node --check src/features/masonry/library.js
          node --check src/features/masonry/index.js
      - name: Approved assets, placement, rendering dependencies and editor
        run: node --test scripts/qa/approved-library.test.mjs tests/tower-approved-manual.test.mjs scripts/qa/manual-masonry.test.mjs
