name: Package verified orbit-star Path build

on:
  push:
    branches:
      - agent/package-16.8.0-orbit-stars-20261002

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fc01e4858f2133b8349da72a10a62b2708c747f
          fetch-depth: 0
      - name: Confirm verified source
        run: test "$(git rev-parse HEAD)" = "1fc01e4858f2133b8349da72a10a62b2708c747f"
      - name: Create full project archive
        run: git archive --format=zip --output=AlanTil-16.8.0-orbit-stars.zip HEAD
      - name: Upload full project archive
        uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.8.0-orbit-stars
          path: AlanTil-16.8.0-orbit-stars.zip
          if-no-files-found: error
          retention-days: 1
