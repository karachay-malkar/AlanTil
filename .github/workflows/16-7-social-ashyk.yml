name: Alan Til 16.7 social and Ashyk

on:
  push:
    branches: [agent/16.7.0-friends-rating-ashyk, agent/16.7.0-community-header-first-run]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alantil-16-7-social-ashyk
  cancel-in-progress: true

jobs:
  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Package complete source archive
        run: |
          git archive --format=zip --output AlanTil-16.7.0.15-source.zip HEAD
          : > AlanTil-16.7.0.15-filesizes.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              bytes=$(stat -c%s "$file")
              kb=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b/1024 }')
              printf '%s — %s KB\n' "$file" "$kb" >> AlanTil-16.7.0.15-filesizes.txt
            else
              printf '%s — deleted\n' "$file" >> AlanTil-16.7.0.15-filesizes.txt
            fi
          done < <(git diff --name-only HEAD^ HEAD)
          sha256sum AlanTil-16.7.0.15-source.zip > AlanTil-16.7.0.15-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.7.0.15-source
          path: |
            AlanTil-16.7.0.15-source.zip
            AlanTil-16.7.0.15-filesizes.txt
            AlanTil-16.7.0.15-source.sha256
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enforce registered-only Ashyk social modes
        run: node scripts/enforce-registered-ashyk-modes-16-7.mjs

      - name: Commit Ashyk registration-mode correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/screens/ashyk.js packages/ashyk-game/web/Game.jsx
          if ! git diff --cached --quiet; then
            git commit -m "16.7.0: gate local and friend Ashyk modes [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Verify synchronized 16.7 visual contract
        run: |
          node scripts/sync-mobile-parity-16-7.mjs
          node scripts/sync-visual-contract-16-7.mjs
          git diff --exit-code -- mobile/screens/ashyk.js mobile/ui/parity.js mobile/ui/web-visual-source.js

      - name: Ensure Walnut Veneer 02 PBR assets
        run: node scripts/fetch-ashyk-walnut-veneer-02.mjs

      - name: Commit Walnut Veneer 02 PBR assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ashyk/materials/walnut-veneer-02
          if ! git diff --cached --quiet; then
            git commit -m "16.7.0: vendor Walnut Veneer 02 PBR assets [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: 16.7 social, visual, Ashyk and OAuth contract
        run: node --test tests/social-ashyk-16-7-0.test.mjs tests/ashyk-online-authority-16-7.test.mjs tests/ashyk-shot-replication-16-7.test.mjs tests/friends-web-parity-16-7-0.test.mjs tests/visual-parity-16-7-0.test.mjs tests/web-auth-cache-16-7-0.test.mjs tests/web-style-cache-resilience-16-7-0.test.mjs tests/auth-pkce-session.test.mjs tests/visitor-analytics.test.mjs tests/admin-activity-13-15-10.test.mjs tests/first-run-guide-stella-16-7-0.test.mjs tests/ashyk-wood-board-16-7-0.test.mjs

      - name: Shared core and unaffected regressions
        run: >-
          node --test
          tests/alantil-core-16.test.mjs
          mobile/tests/cloud-queue-race.test.mjs
          mobile/tests/cloud-scope-transaction.test.mjs
          mobile/tests/practice-mechanics-parity-16-6-7.test.mjs
          mobile/tests/mobile-polish-16-6-8.test.mjs
          mobile/tests/ashyk-ui-help-16-6-12.test.mjs

      - name: Install Web Ashyk build dependencies
        working-directory: tools/ashyk-web
        run: npm install --no-audit --no-fund

      - name: Rebuild Web Ashyk runtime
        run: node tools/ashyk-web/build.mjs

      - name: Verify generated Web Ashyk runtime
        run: |
          test -s src/features/ashyk/runtime.js
          grep -q "ashyk_invite_create" src/features/ashyk/runtime.js
          grep -q "ashyk_invite_accept" src/features/ashyk/runtime.js
          grep -q "ashyk_room_ready" src/features/ashyk/runtime.js
          grep -q "ashyk_room_ping" src/features/ashyk/runtime.js
          grep -q "ashyk_active_room" src/features/ashyk/runtime.js
          grep -q "ashyk_submit_action" src/features/ashyk/runtime.js
          grep -q "ashyk_resolve_timeout" src/features/ashyk/runtime.js
          grep -q "ashyk_claim_forfeit" src/features/ashyk/runtime.js
          grep -q "ashyk-shot:" src/features/ashyk/runtime.js
          grep -q "openVisualStream" src/features/ashyk/runtime.js
          grep -q "beginRemotePlayback" src/features/ashyk/runtime.js
          grep -q "question-select" src/features/ashyk/runtime.js
          grep -q "realtime" src/features/ashyk/runtime.js
          if grep -q "launchRemote" src/features/ashyk/runtime.js; then
            echo "legacy opponent Cannon playback is still bundled" >&2
            exit 1
          fi
          grep -q "walnut_veneer_02_diff_1k.jpg" src/features/ashyk/runtime.js
          grep -q "walnut_veneer_02_nor_gl_1k.jpg" src/features/ashyk/runtime.js
          if grep -q "ashyk_join_room" src/features/ashyk/runtime.js; then
            echo "Legacy room-code RPC remains in generated runtime" >&2
            exit 1
          fi

      - name: Commit generated Web Ashyk runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ashyk/runtime.js
          if ! git diff --cached --quiet; then
            git commit -m "16.7.0: rebuild Web Ashyk runtime [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Verify Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK, source and file sizes
        env:
          BASE_SHA: 56bf2f312d2a520ac1bff38b3c3d3067931ada97
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk AlanTil-16.7.0.apk
          git archive --format=zip --output AlanTil-16.7.0-source.zip HEAD
          : > AlanTil-16.7.0-filesizes.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              bytes=$(stat -c%s "$file")
              kb=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b/1024 }')
              printf '%s — %s KB\n' "$file" "$kb" >> AlanTil-16.7.0-filesizes.txt
            else
              printf '%s — deleted\n' "$file" >> AlanTil-16.7.0-filesizes.txt
            fi
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          sha256sum AlanTil-16.7.0.apk AlanTil-16.7.0-source.zip > AlanTil-16.7.0.sha256
          ls -lh AlanTil-16.7.0.apk AlanTil-16.7.0-source.zip AlanTil-16.7.0-filesizes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AlanTil-16.7.0-friends-rating-ashyk
          path: |
            AlanTil-16.7.0.apk
            AlanTil-16.7.0-source.zip
            AlanTil-16.7.0-filesizes.txt
            AlanTil-16.7.0.sha256
          if-no-files-found: error
