name: Temporary Supabase 2.110.7 vendor builder

on:
  push:
    branches:
      - agent/tmp-supabase-2.110.7-vendor

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact published UMD bundle and encode local ESM payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/vendor package supabase-supabase-js-2.110.7.tgz
          mkdir -p tmp/vendor
          npm pack @supabase/supabase-js@2.110.7 --silent
          tar -xzf supabase-supabase-js-2.110.7.tgz package/dist/umd/supabase.js package/LICENSE
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          umd = Path('package/dist/umd/supabase.js').read_text(encoding='utf-8')
          if 'createClient' not in umd or 'var supabase=' not in umd[:100]:
              raise SystemExit('Unexpected @supabase/supabase-js 2.110.7 UMD bundle')
          source = (umd + '\nexport const createClient = supabase.createClient;\n').encode('utf-8')
          packed = gzip.compress(source, compresslevel=9, mtime=0)
          encoded = base64.b64encode(packed).decode('ascii')
          width = (len(encoded) + 3) // 4
          for index in range(4):
              chunk = encoded[index * width:(index + 1) * width]
              Path(f'tmp/vendor/payload-{index + 1}.txt').write_text(chunk, encoding='ascii')

          metadata = {
              'package': '@supabase/supabase-js',
              'version': '2.110.7',
              'source': 'npm package dist/umd/supabase.js + ESM createClient export',
              'source_bytes': len(source),
              'gzip_bytes': len(packed),
              'base64_bytes': len(encoded),
              'sha256': hashlib.sha256(source).hexdigest(),
          }
          Path('tmp/vendor/metadata.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          Path('tmp/vendor/SUPABASE-JS-LICENSE.txt').write_text(Path('package/LICENSE').read_text(encoding='utf-8'), encoding='utf-8')
          print(json.dumps(metadata))
          PY
      - name: Exercise the generated SDK through a PKCE reload
        run: node --test tmp/auth-pkce-session.test.mjs
      - name: Commit temporary vendor payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tmp/vendor
          if ! git diff --cached --quiet; then
            git commit -m '[vendor-built] Supabase 2.110.7 local ESM payloads'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "BUNDLE_COMMIT=$(git rev-parse HEAD)"
